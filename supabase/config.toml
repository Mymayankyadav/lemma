# Disposable local Lemma stack only. Never run db reset with --linked.
# Matches the hosted Lemma PostgreSQL major version; no production credentials.
project_id = "lemma-sync-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:*/**", "http://localhost:*/**"]
# Short-lived access tokens make the upcoming L7 refresh gate practical.
jwt_expiry = 60
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[inbucket]
enabled = true
port = 54324
