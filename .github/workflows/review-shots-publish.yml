name: Publish review screenshots
on:
  push:
    branches: ['review/**']
permissions:
  contents: write
jobs:
  publish:
    # Never recursively publish the bot's own generated contact sheets.
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/make-themes.ts
      - run: npm run build
      - name: Generate all-theme contact sheets on the review branch
        env:
          THEMES: all
          DENSITY: compact
          EFFECTS: calm
          V4_MATRIX: '0'
        run: |
          (npx vite preview --port 4173 --strictPort > /tmp/lemma-preview.log 2>&1 &)
          sleep 5
          node scripts/review-shots.mjs
      - name: Commit generated contact sheets to the review branch
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add -f review-shots
          if ! git diff --cached --quiet; then
            git commit -m "[shots] all-theme contact sheets"
            git push
          fi
