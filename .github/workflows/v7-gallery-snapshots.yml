name: V7 Constellation gallery snapshots
on:
  push:
    branches: ['owner-setup-v7/constellation']
    paths:
      - '.github/workflows/v7-gallery-snapshots.yml'
      - 'src/ui/v7/**'
      - 'src/features/kit/V7Page.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build testable gallery with URL feature-flag overrides
        env:
          VITE_ALLOW_FLAG_OVERRIDES: '1'
          VITE_FLAGS: '-v6Shell,-v7Shell'
        run: npm run build
      - name: Capture Day and Night at 390 x 844
        shell: bash
        run: |
          set -euo pipefail
          (npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/v7-preview.log 2>&1 &)
          sleep 3
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: {width:390,height:844}, deviceScaleFactor: 1, reducedMotion: 'reduce' });
            await page.goto('http://127.0.0.1:4173/lemma/?demo=1&flags=v7Shell,v6Shell&mode=day#/kit', {waitUntil:'networkidle'});
            await page.getByRole('heading', { name: 'A little more clarity.' }).waitFor();
            await page.evaluate(() => document.fonts.ready);
            await page.screenshot({path:'docs/v7/kit-v7-1-0-day-390x844.png'});
            await page.screenshot({path:'docs/v7/kit-v7-1-0-day-full.png', fullPage:true});
            await page.getByRole('tab', {name:'Night',exact:true}).click();
            await page.locator('html[data-theme="graph-night"]').waitFor();
            await page.evaluate(() => document.fonts.ready);
            await page.screenshot({path:'docs/v7/kit-v7-1-0-night-390x844.png'});
            await page.screenshot({path:'docs/v7/kit-v7-1-0-night-full.png', fullPage:true});
          } finally {
            await browser.close();
          }
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v7-constellation-kit-1-0-gallery
          path: docs/v7/kit-v7-1-0-*.png
          if-no-files-found: error
          retention-days: 14
