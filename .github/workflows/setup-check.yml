name: Setup check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/setup-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence only
        shell: bash
        env:
          HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_LEGACY_DB_PASSWORD: ${{ secrets.LEMMA_SUPABASE_DB_PASSWORD != '' }}
          HAS_MCP_URL: ${{ secrets.MCP_URL != '' }}
        run: |
          {
            echo '| Secret | Status |'
            echo '| --- | --- |'
            for pair in "SUPABASE_ACCESS_TOKEN:$HAS_ACCESS_TOKEN" "SUPABASE_DB_PASSWORD:$HAS_DB_PASSWORD" "LEMMA_SUPABASE_DB_PASSWORD:$HAS_LEGACY_DB_PASSWORD" "MCP_URL:$HAS_MCP_URL"; do
              name="${pair%%:*}"
              status=Missing
              if [[ "${pair#*:}" == true ]]; then status=Present; fi
              echo "| $name | $status |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
