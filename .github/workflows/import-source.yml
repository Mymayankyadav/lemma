name: Import Lemma source archive
on:
  push:
    branches: [main]
    paths: [lemma-phase2-source.zip]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lemma-initial-import
  cancel-in-progress: false
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and extract archive
        run: |
          test -f lemma-phase2-source.zip
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          with ZipFile('lemma-phase2-source.zip') as z:
              for member in z.namelist():
                  p = PurePosixPath(member)
                  if p.is_absolute() or '..' in p.parts or not member.startswith('lemma/'):
                      raise ValueError(f'Unsafe archive member: {member}')
              z.extractall('.import')
          for filename in ('package.json','build.js','src/app/main.js','src/index.html'):
              assert Path('.import/lemma',filename).is_file(), f'Missing required source: {filename}'
          PY
      - name: Copy source without overwriting canonical planning history
        run: |
          mkdir -p docs
          cp -a .import/lemma/src/. src/
          cp -a .import/lemma/test/. test/
          cp .import/lemma/package.json ./
          cp .import/lemma/build.js ./
          cp .import/lemma/capacitor.config.json ./
          cp .import/lemma/.gitignore ./
          cp .import/lemma/PROMPT.md ./
          cp .import/lemma/docs/DATA_MODEL.md docs/
          cp .import/lemma/docs/PHASE2_SYNC_CONTRACT.md docs/
          cp .import/lemma/supabase/schema.sql supabase/legacy_schema_draft.sql
          rm -rf .import
          rm lemma-phase2-source.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit imported source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Lemma Phase 2 application source"
          git push
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and outbox
        run: |
          npm run test:syntax
          npm run test:merge
          npm run test:outbox
          npm run test:optimizer
      - name: Build web application
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Prepare GitHub Pages
        run: |
          mkdir -p site
          cp dist/index.html dist/manifest.webmanifest dist/service-worker.js site/
          cp -r dist/icons site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
