name: Lemma production knowledge migrations (exact versions)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only preflight or explicitly apply exactly the selected reviewed migrations"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - apply
      scope:
        description: "Exact target: knowledge; knowledge + PLAN-01; or plus tutor receipts"
        type: choice
        required: true
        default: knowledge
        options:
          - knowledge
          - knowledge_and_plan
          - knowledge_plan_tutor

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: lemma-production-migration-operator
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.LEMMA_SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LEMMA_PROJECT_REF: yemqnhnztlbyxmjxidis
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Require Lemma credentials, current main and passing CI
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_MODE" = "preflight" || test "$DEPLOY_MODE" = "apply"
          test "$DEPLOY_SCOPE" = "knowledge" || test "$DEPLOY_SCOPE" = "knowledge_and_plan" || test "$DEPLOY_SCOPE" = "knowledge_plan_tutor"
          echo "LEMMA_WORKDIR=$RUNNER_TEMP/lemma-knowledge-deploy" >> "$GITHUB_ENV"
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing LEMMA_SUPABASE_DB_PASSWORD repository secret"; exit 1; }
          test ! -e supabase/.temp/project-ref || { echo "::error::Refusing pre-linked checkout"; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo "::error::Main moved; redispatch on the new main head"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/lemma-checks.json"
          # Android is intentionally path-filtered on web-only commits. Verify
          # the most recent successful main Android build is still applicable.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&status=success&per_page=30" > "$RUNNER_TEMP/lemma-android-runs.json"
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const temp=process.env.RUNNER_TEMP,head=process.env.GITHUB_SHA;
          const checks=JSON.parse(fs.readFileSync(temp+'/lemma-checks.json','utf8')).check_runs;
          const success=c=>c.head_sha===head && c.status==='completed' && c.conclusion==='success';
          for(const name of ['regression','local-stack']){
            if(!checks.some(c=>c.name===name && success(c)))
              throw Error('Required current-main check is not SUCCESS: '+name);
          }
          const currentAndroid=checks.filter(c=>c.name==='android' && c.head_sha===head);
          if(currentAndroid.length){
            if(!currentAndroid.some(success))
              throw Error('Current-main Android check exists but is not SUCCESS');
            console.log('Android gate: verified successful current-main Android check');
          }else{
            const runs=JSON.parse(fs.readFileSync(temp+'/lemma-android-runs.json','utf8')).workflow_runs;
            if(!Array.isArray(runs))throw Error('Missing Android workflow run history');
            // Match *exactly* the path set of .github/workflows/android.yml.
            // --no-renames ensures both old/new paths of a rename are checked.
            const native=p=>p.startsWith('android/') || p==='capacitor.config.json' ||
              /^src\/app\/native_[^/]*\.js$/.test(p) || /^test\/android_[^/]*\.js$/.test(p) ||
              p==='package.json' || p==='package-lock.json' ||
              p==='.github/workflows/android.yml';
            let verified=false;
            for(const run of runs){
              if(run.conclusion!=='success' || run.head_branch!=='main' || run.event!=='push' ||
                 !/^[a-f0-9]{40}$/.test(run.head_sha))continue;
              const prior=run.head_sha;
              const ancestor=cp.spawnSync('git',['merge-base','--is-ancestor',prior,head]);
              if(ancestor.error)throw ancestor.error;
              if(ancestor.status!==0)continue;
              const files=cp.execFileSync('git',
                ['diff','--name-only','--no-renames',prior,head],{encoding:'utf8'})
                .trim().split('\n').filter(Boolean);
              const touched=files.filter(native);
              if(touched.length)
                throw Error('Android CI absent on current main but native inputs changed since '+prior+
                  ': '+touched.join(', '));
              console.log('Android gate: inherited green main build '+prior+
                ', zero Android-trigger paths changed');
              verified=true;
              break;
            }
            if(!verified)
              throw Error('No ancestor green main Android run to substantiate path-filtered skip');
          }
          console.log('Current main SHA has green regression/local-stack and proven Android gate');
          NODE

      - name: Stage only exact reviewed migrations through selected target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LEMMA_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$LEMMA_WORKDIR/supabase/config.toml"
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const expected=[
            '20261026085028_initial_learning_state.sql',
            '20261026090019_versioned_study_planning.sql',
            '20261026090746_cards_reviews_sources.sql',
            '20261026090844_atomic_plan_publication.sql',
            '20261026090959_revision_safe_note_writes.sql',
            '20261026091125_harden_rpc_implementations.sql',
            '20261026121817_enforce_note_rpc_writes.sql',
            '20261026130428_review_retractions.sql',
            '20261026153542_revision_safe_profiles.sql',
            '20261028031800_knowledge_context_cas.sql',
            '20261028043000_knowledge_source_revisions.sql',
            '20261028051500_structured_context_v1.sql'
          ];
          if (process.env.DEPLOY_SCOPE !== 'knowledge')
            expected.push('20261028094500_plan01_append_only_events.sql');
          if (process.env.DEPLOY_SCOPE === 'knowledge_plan_tutor')
            expected.push('20261028120000_tutor01_handoff_receipts.sql');
          const names=fs.readdirSync('supabase/migrations').filter(x=>x.endsWith('.sql')).sort();
          if(names.length<expected.length || expected.some((x,i)=>names[i]!==x))
            throw Error('Required exact legacy/knowledge source filenames changed');
          for(const n of names.slice(expected.length)){
            // R2e is a later A-owned, *unstaged* source migration. The first
            // 14 exact versions must remain deployable before R2e is approved.
            // This exception grants no permission to apply R2e or other SQL.
            const futureReadonlySnapshot =
              n === '20261028163000_release01_owner_snapshot_v1.sql';
            if(!(/^\d{14}_(?:plan01|tutor01)_[a-z0-9_]+\.sql$/.test(n) ||
                 futureReadonlySnapshot) ||
                n.slice(0,14)<=expected[expected.length-1].slice(0,14))
              throw Error('Unexpected extra migration in current main: '+n);
          }
          const destination=process.env.LEMMA_WORKDIR+'/supabase/migrations';
          for(const n of expected)fs.copyFileSync(path.join('supabase/migrations',n),path.join(destination,n));
          console.log('Isolated '+expected.length+' approved exact-version SQL files; no unknown migrations are staged');
          NODE

      - name: Link only to Lemma production (never use db reset)
        shell: bash
        run: |
          set -euo pipefail
          cd "$LEMMA_WORKDIR"
          supabase --version
          supabase link --project-ref "$LEMMA_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          test "$(cat supabase/.temp/project-ref)" = "$LEMMA_PROJECT_REF" ||
            { echo "::error::Wrong linked project"; exit 1; }
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" > "$RUNNER_TEMP/lemma-before.txt" 2>&1
          cat "$RUNNER_TEMP/lemma-before.txt"

      - name: Verify exact source filenames and remote history prefix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const expected=[
            '20261026085028_initial_learning_state.sql',
            '20261026090019_versioned_study_planning.sql',
            '20261026090746_cards_reviews_sources.sql',
            '20261026090844_atomic_plan_publication.sql',
            '20261026090959_revision_safe_note_writes.sql',
            '20261026091125_harden_rpc_implementations.sql',
            '20261026121817_enforce_note_rpc_writes.sql',
            '20261026130428_review_retractions.sql',
            '20261026153542_revision_safe_profiles.sql',
            '20261028031800_knowledge_context_cas.sql',
            '20261028043000_knowledge_source_revisions.sql',
            '20261028051500_structured_context_v1.sql'
          ];
          if (process.env.DEPLOY_SCOPE !== 'knowledge')
            expected.push('20261028094500_plan01_append_only_events.sql');
          if (process.env.DEPLOY_SCOPE === 'knowledge_plan_tutor')
            expected.push('20261028120000_tutor01_handoff_receipts.sql');
          const names=fs.readdirSync(process.env.LEMMA_WORKDIR+'/supabase/migrations').filter(x=>x.endsWith('.sql')).sort();
          if(JSON.stringify(names)!==JSON.stringify(expected))
            throw Error('Unexpected local migrations. Refusing to deploy new, missing or renamed SQL: '+JSON.stringify(names));
          const txt=fs.readFileSync(process.env.RUNNER_TEMP+'/lemma-before.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          // Supabase CLI 2.122 wraps *each* version/time cell in backticks.
          // Parse only the real Local | Remote | Time (UTC) table; never infer
          // a migration from prose, or silently skip malformed data rows.
          const lines=txt.split(/\r?\n/);
          const header=lines.findIndex(x=>/^\s*Local\s*[│|]\s*Remote\s*[│|]\s*Time \(UTC\)\s*$/.test(x));
          if(header<0 || !/^\s*-+\s*[│|]\s*-+\s*[│|]\s*-+\s*$/.test(lines[header+1]||''))
            throw Error('Missing Supabase migration-list table header/separator');
          const rows=[];
          for(const line of lines.slice(header+2)){
            if(!line.trim())break;
            const parts=line.split(/[│|]/);
            if(parts.length!==3)throw Error('Malformed migration-list data row');
            const cells=parts.map(part=>{
              const value=part.trim();
              const quote=/^\x60([^\x60]*)\x60$/.exec(value);
              if(value.includes('\x60') && !quote)
                throw Error('Malformed migration-list quoting');
              return (quote?quote[1]:value).trim();
            });
            if(!/^\d{14}$/.test(cells[0]) ||
               (cells[1] && !/^\d{14}$/.test(cells[1])) ||
               !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(cells[2]))
              throw Error('Invalid migration-list version or timestamp');
            rows.push(cells);
          }
          if(rows.length!==expected.length) throw Error('Unexpected migration-list row count '+rows.length);
          let remoteCount=0;
          rows.forEach((row,i)=>{
            const version=expected[i].slice(0,14);
            if(row[0]!==version) throw Error('Local migration ordering mismatch at '+i);
            if(row[1]){
              if(row[1]!==version || i!==remoteCount) throw Error('Remote history is not an exact source prefix');
              remoteCount++;
            }
          });
          if(remoteCount<9) throw Error('Missing original nine production migrations');
          const pending=expected.slice(remoteCount);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/lemma-pending.json',JSON.stringify(pending));
          console.log('Verified '+remoteCount+' exact applied versions; pending: '+JSON.stringify(pending));
          NODE

      - name: Require precise dry-run migration set
        shell: bash
        run: |
          set -euo pipefail
          cd "$LEMMA_WORKDIR"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run > "$RUNNER_TEMP/lemma-dryrun.txt" 2>&1
          cat "$RUNNER_TEMP/lemma-dryrun.txt"
          node <<'NODE'
          const fs=require('node:fs');
          const want=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/lemma-pending.json','utf8'));
          const txt=fs.readFileSync(process.env.RUNNER_TEMP+'/lemma-dryrun.txt','utf8')
            .replace(/\x1b\[[0-9;]*m/g,'');
          // Supabase CLI 2.122 prints "Would push these migrations:" followed
          // by one bullet per file, not "Would push migration <filename>".
          // Fail closed if this is not an explicitly completed read-only run.
          const lines=txt.split(/\r?\n/).map(line=>line.trim());
          if(!lines.includes('DRY RUN: migrations will *not* be pushed to the database.'))
            throw Error('Missing Supabase read-only dry-run confirmation');
          const heading=lines.indexOf('Would push these migrations:');
          const finished=lines.indexOf('Finished supabase db push.');
          if(finished<0 || (heading>=0 && heading>=finished))
            throw Error('Incomplete or malformed Supabase dry-run output');
          const got=[];
          if(heading>=0){
            for(const line of lines.slice(heading+1,finished)){
              const bullet=/^[•*-]\s+(\d{14}_[a-z0-9_]+\.sql)$/.exec(line);
              if(!bullet)throw Error('Unexpected dry-run migration list row: '+line);
              got.push(bullet[1]);
            }
            if(!got.length)throw Error('Empty Supabase migration-list output');
          }else if(want.length!==0 || !lines.includes('Remote database is up to date.')){
            throw Error('Missing Supabase pending-migrations list');
          }
          if(JSON.stringify(got)!==JSON.stringify(want))
            throw Error('Dry-run filenames differ from expected pending list: '+JSON.stringify(got));
          console.log('Dry-run precisely matches expected source versions');
          NODE

      - name: Apply exact versions (explicit apply mode only)
        if: env.DEPLOY_MODE == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo "::error::Main moved; no production write"; exit 1; }
          cd "$LEMMA_WORKDIR"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" > "$RUNNER_TEMP/lemma-after.txt" 2>&1
          cat "$RUNNER_TEMP/lemma-after.txt"
          node <<'NODE'
          const fs=require('node:fs');
          const txt=fs.readFileSync(process.env.RUNNER_TEMP+'/lemma-after.txt','utf8').replace(/\x1b\[[0-9;]*m/g,'');
          // Supabase CLI 2.122 wraps *each* version/time cell in backticks.
          // Parse only the real Local | Remote | Time (UTC) table; never infer
          // a migration from prose, or silently skip malformed data rows.
          const lines=txt.split(/\r?\n/);
          const header=lines.findIndex(x=>/^\s*Local\s*[│|]\s*Remote\s*[│|]\s*Time \(UTC\)\s*$/.test(x));
          if(header<0 || !/^\s*-+\s*[│|]\s*-+\s*[│|]\s*-+\s*$/.test(lines[header+1]||''))
            throw Error('Missing Supabase migration-list table header/separator');
          const rows=[];
          for(const line of lines.slice(header+2)){
            if(!line.trim())break;
            const parts=line.split(/[│|]/);
            if(parts.length!==3)throw Error('Malformed migration-list data row');
            const cells=parts.map(part=>{
              const value=part.trim();
              const quote=/^\x60([^\x60]*)\x60$/.exec(value);
              if(value.includes('\x60') && !quote)
                throw Error('Malformed migration-list quoting');
              return (quote?quote[1]:value).trim();
            });
            if(!/^\d{14}$/.test(cells[0]) ||
               (cells[1] && !/^\d{14}$/.test(cells[1])) ||
               !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(cells[2]))
              throw Error('Invalid migration-list version or timestamp');
            rows.push(cells);
          }
          const names=fs.readdirSync(process.env.LEMMA_WORKDIR+'/supabase/migrations').filter(x=>x.endsWith('.sql')).sort();
          if(rows.length!==names.length || rows.some((row,i)=>row[0]!==names[i].slice(0,14)||row[1]!==row[0]))
            throw Error('Post-deploy migration history is not fully version-identical; investigate without repair');
          console.log('Applied and verified all '+names.length+' exact Lemma migration versions');
          NODE

      - name: Publish preflight or application summary
        if: always()
        shell: bash
        run: |
          echo "### Lemma knowledge migration operator" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`yemqnhnztlbyxmjxidis\` (Lemma only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: \`$DEPLOY_MODE\` · scope: \`$DEPLOY_SCOPE\` · SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow never repairs history, resets a database, or uses the MCP migration endpoint." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_MODE" = preflight ]; then
            echo "Read-only preflight: **no production migrations applied**." >> "$GITHUB_STEP_SUMMARY"
          fi
