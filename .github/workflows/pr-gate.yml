name: PR gate
# The fast gate every PR must pass. Required check: `fast-gate` (aggregates everything below).
# Also runnable by workflow_dispatch (inputs pr/base) so CI-opened PRs (revert, calibration) get the
# exact same check names attached to their head commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (set by CI for revert and calibration PRs)
        required: false
      base:
        description: Base branch to diff against
        required: false
        default: main
permissions:
  contents: read
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true
env:
  LEMMA_PERF: 'off'
  CI_JUNIT_DIR: ${{ github.workspace }}/junit

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      # v2.0: reuse=true when only CURRENT.md / NEXT.md changed since the PR's last green fast-gate; every test job
      # below is then skipped and fast-gate passes on that earlier result (scripts/ci/reuse.mjs).
      reuse: ${{ steps.reuse.outputs.reuse || 'false' }}
      all: ${{ steps.aff.outputs.all || 'false' }}
      sql: ${{ steps.aff.outputs.sql || 'false' }}
      unit: ${{ steps.aff.outputs.unit }}
      e2e: ${{ steps.aff.outputs.e2e }}
      unit_count: ${{ steps.aff.outputs.unit_count || '0' }}
      e2e_count: ${{ steps.aff.outputs.e2e_count || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: reuse
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/reuse.mjs
      - id: aff
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.ref || inputs.base || 'main' }}
        run: node scripts/ci/affected.mjs --base "origin/$BASE" --head HEAD

  typecheck-lint:
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: node scripts/ci/lint.mjs

  unit-affected:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.unit_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (everything, shared code changed)
        if: needs.changes.outputs.all == 'true'
        run: npx vitest run --passWithNoTests
      - name: Unit tests (affected only)
        if: needs.changes.outputs.all != 'true'
        env:
          FILES: ${{ needs.changes.outputs.unit }}
        run: npx vitest run --passWithNoTests $FILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit-affected
          path: junit/
          if-no-files-found: ignore
          retention-days: 7

  smoke-e2e:
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_JUNIT_NAME: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke flows (projects, project, session, proposals, insights, settings)
        run: npm run e2e -- $(node -p "require('./ci/test-map.json').smoke.join(' ')")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-smoke-e2e
          path: junit/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e-affected:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.e2e_count != '0'
    name: e2e-affected-${{ matrix.shard }}-of-4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_JUNIT_NAME: affected-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Affected e2e specs (shard)
        env:
          FILES: ${{ needs.changes.outputs.e2e }}
        run: npm run e2e -- $FILES --shard=${{ matrix.shard }}/4 --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e-affected-${{ matrix.shard }}
          path: junit/
          if-no-files-found: ignore
          retention-days: 7

  sql:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Always reports so the required check never hangs; steps run only when supabase/** or tests/mcp/** changed
    # (or shared code changed).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lemma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lemma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTIF_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/lemma_test
    steps:
      - name: SQL tests not needed for this change
        if: needs.changes.outputs.sql != 'true'
        run: echo "No supabase/** or SQL test changes; skipped."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.sql == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.sql == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.sql == 'true'
      - name: Install pinned isolated PostgreSQL harness
        if: needs.changes.outputs.sql == 'true'
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/lemma-mcp-sql-harness"
          mkdir -p "$harness" node_modules/@electric-sql
          printf '{"name":"lemma-mcp-sql-harness","private":true}\n' > "$harness/package.json"
          npm install --prefix "$harness" --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.13 pg@8.16.3
          test ! -e node_modules/@electric-sql/pglite
          test ! -e node_modules/pg
          ln -s "$harness/node_modules/@electric-sql/pglite" node_modules/@electric-sql/pglite
          ln -s "$harness/node_modules/pg" node_modules/pg
          node --input-type=module -e "await import('@electric-sql/pglite'); await import('pg')"
      - name: SQL tests (all blocking scripts; the timing check notif1b-stress runs in perf-report)
        if: needs.changes.outputs.sql == 'true'
        shell: bash
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: |
          rc=0
          for f in db2 st5 db5 notif1a notif1a-concurrency notif1b notif1b-candidates notif1b-concurrency; do
            echo "::group::tests/mcp/$f.mjs"
            node "tests/mcp/$f.mjs" || rc=1
            echo "::endgroup::"
          done
          if [ -f tests/mcp/transactions.mjs ]; then node tests/mcp/transactions.mjs || rc=1; fi
          # every tests/mcp/sql/*.mjs runs too, so new SQL tests need no workflow change
          shopt -s nullglob
          for f in $(printf '%s\n' tests/mcp/sql/*.mjs | sort); do
            echo "::group::$f"
            node "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.sql == 'true'
        with:
          name: junit-sql
          path: junit/
          if-no-files-found: ignore
          retention-days: 7

  fast-gate:
    name: fast-gate
    needs: [changes, typecheck-lint, unit-affected, smoke-e2e, e2e-affected, sql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded (skipped is fine only for the conditional ones)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # v2.0: when only CURRENT.md / NEXT.md changed since a green fast-gate, every test job is skipped on purpose
          if [ "$(echo "$NEEDS" | jq -r '.changes.outputs.reuse // "false"')" = "true" ]; then must='["changes"]'; echo "Reusing an earlier green fast-gate: only bookkeeping files changed."; else must='["changes","typecheck-lint","smoke-e2e"]'; fi
          bad=$(echo "$NEEDS" | jq -r --argjson must "$must" 'to_entries[] | select(.value.result != "success" and (.value.result != "skipped" or (.key|IN($must[])))) | .key')
          if [ -n "$bad" ]; then echo "::error::fast-gate failed because of: $bad"; exit 1; fi

  report:
    needs: [fast-gate]
    if: always() && needs.fast-gate.result == 'failure' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
        continue-on-error: true
      - name: Failure signatures
        run: node scripts/ci/signatures.mjs junit signatures.json
      - name: Record signatures and open or update incidents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node scripts/ci/incident.mjs pr

  feedback:
    # Agents cannot read CI logs: say exactly what failed and how to fix it (one PR comment, edited in place, plus the
    # output summary of the fast-gate check).
    needs: [fast-gate]
    if: always() && (needs.fast-gate.result == 'success' || needs.fast-gate.result == 'failure') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.fast-gate.result == 'failure'
        with:
          pattern: junit-*
          path: junit
        continue-on-error: true
      - name: Failure signatures
        if: needs.fast-gate.result == 'failure'
        run: node scripts/ci/signatures.mjs junit signatures.json || true
      - name: Write the feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/fast-gate-feedback.mjs
