name: labels
# Creates any label from ci/labels.json that is missing (idempotent), and removes changes-requested and needs-review when the
# author pushes (a fresh Ready and a fresh approval are then needed). Neither job runs PR code.
on:
  pull_request_target:
    types: [synchronize]
  push:
    branches: [main]
    paths: ['ci/labels.json']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  clear-changes-requested:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Remove changes-requested and needs-review after a push
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # a push voids the review state: the author must post Ready again, and a fresh approval is needed
          for label in changes-requested needs-review; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR/labels/$label")
            echo "DELETE $label -> $code"
            case "$code" in 200|204|404) ;; *) echo "::error::could not remove the $label label (HTTP $code)"; exit 1 ;; esac
          done
  labels:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/labels.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
