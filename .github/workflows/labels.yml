name: labels
# Creates any label from ci/labels.json that is missing (idempotent), and removes changes-requested when the
# author pushes a fix (a fresh approval is then needed). Neither job runs PR code.
on:
  pull_request_target:
    types: [synchronize]
  push:
    branches: [main]
    paths: ['ci/labels.json']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  clear-changes-requested:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Remove changes-requested after a push
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR/labels/changes-requested")
          echo "DELETE changes-requested -> $code"
          case "$code" in 200|204|404) ;; *) echo "::error::could not remove the changes-requested label (HTTP $code)"; exit 1 ;; esac
  labels:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/labels.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
