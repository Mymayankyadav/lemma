name: Lemma regression tests
on:
  push:
    branches: [main, 'astra/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: lemma-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast (~20 s) check for every PR: plan structure and lane ownership. Docs-only PRs merge on this alone.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan and lane ownership
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          node test/plan_protocol.js
          node test/lane_guard.js
          case "$PR_HEAD_REF" in
            lane-[a-z]/*) node test/lane_guard.js "$(printf '%s' "$PR_HEAD_REF" | cut -c6 | tr a-z A-Z)" ;;
            integration/*) node test/lane_guard.js integration ;;
            '') ;;
            *) echo "Unknown PR branch prefix: $PR_HEAD_REF"; exit 1 ;;
          esac
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip full suite for documentation-only PRs
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Documentation-only PR: full suite skipped (guard job covers it)."
          else echo "code=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.scope.outputs.code == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.scope.outputs.code == 'true'
        run: npm run test:syntax
      # Azure's Ubuntu archive mirror intermittently hangs for minutes on hosted
      # runners, cancelling otherwise green full regressions before npm test.
      # Use the canonical HTTPS archive only inside this disposable CI runner.
      - name: Prefer direct Ubuntu archive for Chromium dependencies
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done
      - name: Cache Playwright Chromium
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.scope.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.code == 'true'
        run: npm test
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-ui-screenshots
          path: test-output/ui/*.png
          if-no-files-found: ignore
          retention-days: 14
  # Agents cannot download Actions artifacts (blob storage is blocked in their sandbox), so the
  # PNGs are also pushed to the never-merged `ci-screenshots` branch, readable through the
  # GitHub contents API. This job runs no repository code; only it has write access.
  publish-screenshots:
    needs: regression
    if: always() && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: lemma-ci-screenshots
      cancel-in-progress: false
    env:
      FOLDER: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        id: shots
        continue-on-error: true
        with:
          name: lemma-ui-screenshots
          path: shots
      - name: Push screenshots to ci-screenshots branch
        if: steps.shots.outcome == 'success'
        run: |
          set -eu
          ls shots/*.png >/dev/null
          git config --global user.name "lemma-ci"
          git config --global user.email "lemma-ci@users.noreply.github.com"
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf pub && mkdir pub && cd pub && git init -q && git remote add origin "$url"
            if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q -b ci-screenshots FETCH_HEAD
            else git checkout -q --orphan ci-screenshots; fi
            rm -rf "$FOLDER" && mkdir -p "$FOLDER" && cp ../shots/*.png "$FOLDER"/
            {
              echo "# $FOLDER screenshots"
              echo
              echo "Source commit: $SOURCE_SHA · run ${GITHUB_RUN_ID} · $(date -u +%Y-%m-%dT%H:%MZ)"
              echo
              for f in "$FOLDER"/*.png; do n=$(basename "$f"); echo "- [$n]($n)"; done
            } > "$FOLDER/README.md"
            printf '# CI UI screenshots\n\nWritten by the regression workflow. Never merge this branch. `main/` is the latest main; `pr-N/` is the latest run of PR N. Each folder README names its source commit.\n' > README.md
            git add -A
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "screenshots: $FOLDER at ${SOURCE_SHA:0:7}"
            if git push -q origin ci-screenshots; then echo "published $FOLDER"; exit 0; fi
            cd .. && sleep $((attempt * 5))
          done
          echo "could not publish after 5 attempts"; exit 1
