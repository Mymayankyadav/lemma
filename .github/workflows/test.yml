name: Lemma regression tests
on:
  push:
    branches: [main, 'astra/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: lemma-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:syntax
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-ui-screenshots
          path: test-output/ui/*.png
          if-no-files-found: ignore
          retention-days: 14
