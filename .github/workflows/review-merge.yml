name: review-merge
# CI merges, agents do not. A reviewer comments exactly `Approve · Agent: <name>` or
# `Changes requested · Agent: <name>: <what to change>`; scripts/ci/approve.mjs squash-merges with CI_BOT_TOKEN when
# the approval is valid and fast-gate and scope are green on the current head (rules in AGENTS.md "Review and merge").
# Runs from the default branch only and never checks out or runs PR code. CI_BOT_TOKEN is used here because a merge
# by GITHUB_TOKEN would not start the full suite on main. Re-evaluated when PR gate / scope finish, so an approval
# given while checks were still running is not lost.
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['PR gate', 'scope']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true
permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
  actions: read
concurrency:
  group: review-merge-${{ github.event.issue.number || inputs.pr || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  review-merge:
    # Only verdict comments on pull requests start a run; any other comment is ignored without a runner.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, 'Approve') || startsWith(github.event.comment.body, 'Changes requested')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate and, if every rule holds, squash-merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node scripts/ci/approve.mjs
