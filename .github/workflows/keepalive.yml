name: Keepalive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://yemqnhnztlbyxmjxidis.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_VXVRKxz662EOyIFg4UwmaA_N1nywXRA
    steps:
      - name: Ping Lemma
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 30             -X POST "$SUPABASE_URL/rest/v1/rpc/ping"             -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "Content-Type: application/json" --data '{}'
