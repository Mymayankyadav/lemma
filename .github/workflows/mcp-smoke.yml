name: MCP smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Supabase]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# A completed deploy can trigger this while a newer deploy is already
# running its mutating post-deploy selftest. Never overlap those requests.
concurrency:
  group: lemma-mcp-selftest
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MCP_URL: ${{ secrets.MCP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed connector
        shell: bash
        run: |
          if [[ -z "$MCP_URL" ]]; then
            echo "::notice::MCP smoke skipped: add the MCP_URL secret after MCP-1."
          elif [[ ! -f tests/mcp/smoke.mjs ]]; then
            echo "::notice::MCP smoke skipped: MCP-1 has not supplied the smoke script yet."
          else
            node tests/mcp/smoke.mjs
          fi
