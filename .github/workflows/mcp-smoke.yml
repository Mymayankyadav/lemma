name: MCP smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Supabase]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
  actions: read
# Every run attempt gets a durable FIFO ticket. GitHub Actions concurrency
# would silently replace the older pending run when a third trigger arrives.
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MCP_URL: ${{ secrets.MCP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Acquire durable MCP selftest FIFO ticket
        timeout-minutes: 56
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mcp-selftest-queue.mjs acquire
      - name: Verify deployed connector
        shell: bash
        run: |
          # A completed-success workflow must mean the connector was tested.
          # Never print the URL: it contains a secret path component.
          if [[ -z "$MCP_URL" ]]; then
            echo "::error::MCP smoke blocked: MCP_URL is not configured."
            exit 1
          elif [[ ! -f tests/mcp/smoke.mjs ]]; then
            echo "::error::MCP smoke blocked: missing smoke script."
            exit 1
          else
            node tests/mcp/smoke.mjs
          fi
      - name: Release MCP selftest FIFO ticket
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mcp-selftest-queue.mjs release
