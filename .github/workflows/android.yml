name: Lemma Android debug APK

on:
  push:
    branches: [main, lane-c/android-01-s2-native-back-resume]
  pull_request:

permissions:
  contents: write # temporary lane-only dependency bootstrap; restore to read before PR

concurrency:
  group: lemma-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Bootstrap approved Capacitor App 8.0.0 dependency on Lane C only
        if: github.event_name == 'push' && github.ref == 'refs/heads/lane-c/android-01-s2-native-back-resume'
        run: |
          if ! node -e "process.exit(require('./package.json').dependencies['@capacitor/app']==='8.0.0' ? 0 : 1)"; then
            npm install @capacitor/app@8.0.0 --save-exact --no-audit --no-fund
            npm run android:sync
            git add package.json package-lock.json android/
            node test/lane_guard.js C
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(android-01): pin Capacitor App 8.0.0 and sync native plugin'
            git push origin HEAD:lane-c/android-01-s2-native-back-resume
          fi
      - name: Check syntax and lane ownership
        run: |
          npm run test:syntax
          npm run test:plan
          node test/lane_guard.js C
      - name: Sync bundled web application
        run: npm run android:sync
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lemma-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
