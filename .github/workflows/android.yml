name: Android
# N123 · builds Lemma for Android (Capacitor) and checks it: the shell invariants, the web layer's platform tests,
# the Java unit tests, Android lint and a debug APK. There is no Play Console: on main (and on a `android-v*` tag or a
# manual run) it also builds a release APK signed with the Owner's own key and attaches it to a GitHub Release, to
# install on the phone directly (the same model as the Carrel app). Without the four ANDROID_KEY* secrets the release
# step is skipped with a notice, never published unsigned.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/platform/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/android-*.mjs'
      - 'tests/unit/android/**'
      - '.github/workflows/android.yml'
  push:
    tags: ['android-v*']
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/android-*.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - name: Shell and platform checks
        run: node android/scripts/check-shell.mjs && npx vitest run tests/unit/android
      - name: Web bundle for the app
        run: npm run build:android
      - name: Java unit tests, lint, debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lemma-android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 7

  release:
    # Only main, an android-v* tag or a manual run publishes; pull requests never do.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Signing key present?
        if: env.SIGNED != 'true'
        run: echo "::notice title=No Android release::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish a signed APK."
      - uses: actions/checkout@v4
        if: env.SIGNED == 'true'
      - uses: actions/setup-node@v4
        if: env.SIGNED == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: env.SIGNED == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK 36
        if: env.SIGNED == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - if: env.SIGNED == 'true'
        run: npm ci && npm run build:android
      - name: Restore the signing key
        if: env.SIGNED == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lemma-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/lemma-release.jks" >> "$GITHUB_ENV"
      - name: Signed release APK
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify the signature
        if: env.SIGNED == 'true'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p out && cp "$APK" out/Lemma.apk
          (cd out && sha256sum Lemma.apk > SHA256SUMS.txt)
      - name: Attach to a GitHub Release
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then TAG="$REF_NAME"; else TAG="android-build-$RUN"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$COMMIT" --title "Lemma for Android 2.0.$RUN" \
            --notes "Install Lemma.apk on the phone (allow installs from this source once). Same signing key as earlier builds, so it updates in place."
          gh release upload "$TAG" out/Lemma.apk out/SHA256SUMS.txt --clobber
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lemma-release.jks"
