name: Lemma Android debug APK

on:
  push:
    branches:
      - main
      - lane-c/android-01-s1-scaffold-ci
  pull_request:

permissions:
  contents: write # Temporary bootstrap permission; reduced to read before PR.

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Bootstrap Capacitor 8 scaffold on the lane C branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/lane-c/android-01-s1-scaffold-ci'
        run: |
          if [ ! -f android/gradlew ]; then
            npm run android:add
            git add android/
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(android-01): generate pinned Capacitor 8 Android project'
            git push origin HEAD:lane-c/android-01-s1-scaffold-ci
          fi
      - name: Sync bundled web application
        run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lemma-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
