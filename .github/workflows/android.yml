name: Lemma Android debug APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lemma-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check syntax and lane ownership
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          npm run test:syntax
          npm run test:plan
          case "$PR_HEAD_REF" in
            lane-[a-z]/*) node test/lane_guard.js "$(printf '%s' "$PR_HEAD_REF" | cut -c6 | tr a-z A-Z)" ;;
            integration/*) node test/lane_guard.js integration ;;
            '') node test/lane_guard.js ;;
            *) echo "Unknown PR lane: $PR_HEAD_REF"; exit 1 ;;
          esac
      - name: Sync bundled web application
        run: npm run android:sync
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK identity, signature and exact bundled assets
        run: node test/android_apk_artifact.js android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lemma-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            test-output/android-apk-metadata.json
          if-no-files-found: error
