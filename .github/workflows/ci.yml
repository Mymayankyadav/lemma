name: CI
# The FULL suite. Runs on every push to main (and on the throwaway branch selftest/main used to test the revert path),
# not on PRs: PRs run the fast gate (pr-gate.yml) instead. If this run is red the `revert` job reverts the
# merge(s) since the last green run and opens/updates the S0 incident. Timing-based checks run in
# perf-report.yml (non-blocking); LEMMA_PERF=off makes the runners skip them here.
on:
  push:
    branches: [main, 'selftest/main']
  workflow_dispatch:
    inputs:
      recheck:
        description: 'Set by CI: the one automatic re-run of a red main on fresh runners'
        required: false
        default: 'false'
permissions:
  contents: read
env:
  LEMMA_PERF: 'off'
  CI_JUNIT_DIR: ${{ github.workspace }}/junit
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: a newer push must not kill the revert job of an older red one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-check
          path: junit/
          if-no-files-found: ignore
          retention-days: 7

  # Each Playwright case runs exactly once; separate runners keep the growing
  # S/X × Graph day/night suite below the 30-minute per-job limit. All four
  # check runs must succeed, in addition to check, mcp-sql and qa3-screens.
  e2e:
    name: e2e-${{ matrix.shard }}-of-4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_JUNIT_NAME: e2e-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4 --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e-${{ matrix.shard }}
          path: junit/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-shard-${{ matrix.shard }}
          path: test-results/screens/
          if-no-files-found: error
          retention-days: 14

  # Do not validate an incomplete shard: the 144 ST-0 PNG envelopes are
  # checked only after every shard succeeds and all artifacts are combined.
  # Moved to perf-report.yml: it validates the 144 ST-0 screenshots written by the timing-based stress spec,
  # which no longer runs here. Kept (skipped unless the repo variable LEMMA_QA3_IN_CI is 'true') because
  # tests/unit/ci/workflow-sharding.test.ts pins this job.
  qa3-screens:
    needs: e2e
    if: ${{ vars.LEMMA_QA3_IN_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: screens-shard-*
          path: test-results/screens/
          merge-multiple: true
      - name: Validate QA-3b screenshot PNG envelopes
        run: npx tsx scripts/qa3-screens.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa3-screenshot-structure
          path: test-results/qa3/screenshot-structure.md
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens/
          if-no-files-found: ignore
          retention-days: 14
  mcp-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Isolated PostgreSQL is required to verify two real connections racing
    # against the NOTIF-1a advisory-lock cap; never use live Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lemma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lemma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTIF_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/lemma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned isolated PostgreSQL harness
        shell: bash
        run: |
          set -euo pipefail
          # A second npm install inside the application tree can crash Arborist
          # (edgesOut) after npm ci; use a clean test-only dependency graph.
          harness="$RUNNER_TEMP/lemma-mcp-sql-harness"
          mkdir -p "$harness" node_modules/@electric-sql
          printf '{"name":"lemma-mcp-sql-harness","private":true}\n' > "$harness/package.json"
          npm install --prefix "$harness" --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.13 pg@8.16.3
          test -f "$harness/node_modules/@electric-sql/pglite/package.json"
          test -f "$harness/node_modules/pg/package.json"
          # ESM imports in tests/mcp resolve in the repository. Link only the
          # two pinned harness entrypoints; their transitive deps remain isolated.
          test ! -e node_modules/@electric-sql/pglite
          test ! -e node_modules/pg
          ln -s "$harness/node_modules/@electric-sql/pglite" node_modules/@electric-sql/pglite
          ln -s "$harness/node_modules/pg" node_modules/pg
          node --input-type=module -e "await import('@electric-sql/pglite'); await import('pg')"
      - name: Verify DB-2 action log, undo and owner isolation
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/db2.mjs
      - name: Verify ST-5 owner-scoped aggregate and paging SQL
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/st5.mjs
      - name: Verify DB-5 transcription provenance and reversible pages
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/db5.mjs
      - name: Verify NOTIF-1a reminder tables, RLS and device cap
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/notif1a.mjs
      - name: Verify NOTIF-1a two-connection insert and restore races
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/notif1a-concurrency.mjs
      - name: Verify NOTIF-1b atomic notification actions, undo and owner isolation
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/notif1b.mjs
      - name: Verify NOTIF-1b bounded candidates, due quota and time zones
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/notif1b-candidates.mjs
      - name: Verify NOTIF-1b two-connection atomic claim and rollback
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/notif1b-concurrency.mjs
      - name: Verify MCP-2 atomic transactions when available
        if: hashFiles('tests/mcp/transactions.mjs') != ''
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        run: node tests/mcp/transactions.mjs
      - name: Verify every tests/mcp/sql/*.mjs (new SQL tests run without a workflow change)
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/sql-reporter.cjs
        shell: bash
        run: |
          shopt -s nullglob
          rc=0
          for f in $(printf '%s\n' tests/mcp/sql/*.mjs | sort); do
            echo "::group::$f"
            node "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-sql
          path: junit/
          if-no-files-found: ignore
          retention-days: 7

  # Red main -> one revert PR + one S0 incident (see scripts/ci/revert.mjs, incident.mjs).
  revert:
    needs: [check, e2e, mcp-sql]
    if: always() && (needs.check.result == 'failure' || needs.e2e.result == 'failure' || needs.mcp-sql.result == 'failure') && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'selftest/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GUARD_BRANCH: ${{ github.ref_name }}
      GITHUB_TOKEN: ${{ github.token }}
      # Only main-side events reach this job (push to main / selftest/main, dispatch). The bot token opens and
      # merges CI's own revert PR so it gets its real checks; it is never used by a pull_request job.
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      FAILED_JOBS: ${{ needs.check.result == 'failure' && 'check ' || '' }}${{ needs.e2e.result == 'failure' && 'e2e ' || '' }}${{ needs.mcp-sql.result == 'failure' && 'mcp-sql' || '' }}
    steps:
      # v1.7: a browser, runner or timing glitch (for example "Unable to capture screenshot", or a unit test that
      # asserts before async state renders) must not freeze every merge and revert an innocent PR. When main goes red,
      # run the whole suite once more on fresh runners first; the incident and the revert happen only if that second
      # run is red as well. Any failing job counts: on 2026-11-05 a flaky unit test in `check` reverted an unrelated
      # merge, so `check` is not exempt. The re-run is a workflow_dispatch of this workflow (recheck=true), which never
      # re-checks again.
      - name: Re-run once on fresh runners before declaring main red
        id: recheck
        if: github.ref_name == github.event.repository.default_branch && inputs.recheck != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME" -f recheck=true -R "$GITHUB_REPOSITORY"
          echo "rechecking=true" >> "$GITHUB_OUTPUT"
          echo "::warning::e2e failed on main; no incident or revert yet. CI runs the full suite once more on fresh runners and acts only if that is red too."
      - uses: actions/checkout@v4
        if: steps.recheck.outputs.rechecking != 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        if: steps.recheck.outputs.rechecking != 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: steps.recheck.outputs.rechecking != 'true'
        with:
          pattern: junit-*
          path: junit
        continue-on-error: true
      - if: steps.recheck.outputs.rechecking != 'true'
        run: node scripts/ci/signatures.mjs junit signatures.json
      - name: Open or update the S0 incident
        if: steps.recheck.outputs.rechecking != 'true'
        run: node scripts/ci/incident.mjs main
      - name: Revert the merge(s) since the last green run
        if: steps.recheck.outputs.rechecking != 'true'
        run: node scripts/ci/revert.mjs

  # Green main -> close the main incident automatically.
  main-green:
    needs: [check, e2e, mcp-sql]
    if: needs.check.result == 'success' && needs.e2e.result == 'success' && needs.mcp-sql.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/incident.mjs main-green
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # v1.7: PRs approved while an S0 freeze was on are not re-evaluated by anything else. Now that main is green,
      # evaluate every open PR labelled needs-review (same rules as review-merge.yml; the bot token merges, so the
      # merge starts the full suite). Main-side only: this job runs on push to main, never for a pull request.
      - name: Re-evaluate PRs that were waiting (approved during a freeze)
        if: github.ref_name == github.event.repository.default_branch
        run: node scripts/ci/approve.mjs
        env:
          ALL_OPEN: '1'
          GITHUB_TOKEN: ${{ github.token }}
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
