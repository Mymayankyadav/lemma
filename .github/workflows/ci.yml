name: CI
# FIX #255: isolated PostgreSQL acceptance gate follows in this PR.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    # ST-0's eight-case layout suite plus 144 independent cold 4x route
    # renders require a longer CI window. Per-route 1500ms limits are unchanged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # Phase 0 adds the harness before screen specs land in P0-B.
      # All eight cold 4x matrices execute in the separate required job below.
      # The regular Playwright job still runs every other test.
      - run: |
          npm run e2e -- --pass-with-no-tests --grep-invert 'AUDIT #540 cold 4x'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            test-results/screens/
            test-results/stress-cpu/
            test-results/qa3/
          if-no-files-found: ignore
          retention-days: 14
  cpu-matrix:
    runs-on: ubuntu-latest
    # Required, independent 144-route cold 4x evidence gate. No thresholds
    # or routes are relaxed; parallelizing CI jobs avoids a 60m combined timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all 144 cold 4x route measurements
        run: npx playwright test tests/e2e/stress-cpu.spec.ts
      - name: QA-3 4x cold-route evidence gate
        run: npx tsx scripts/qa3-cpu-report.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-cpu-screens
          path: |
            test-results/screens/stress-cpu/
            test-results/stress-cpu/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-cpu-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  mcp-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned isolated PostgreSQL harness
        run: npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.13
      - name: Verify DB-2 action log, undo and owner isolation
        run: node tests/mcp/db2.mjs
      - name: Verify ST-5 owner-scoped aggregate and paging SQL
        run: node tests/mcp/st5.mjs
      - name: Verify DB-5 transcription provenance and reversible pages
        run: node tests/mcp/db5.mjs
      - name: Verify MCP-2 atomic transactions when available
        if: hashFiles('tests/mcp/transactions.mjs') != ''
        run: node tests/mcp/transactions.mjs
