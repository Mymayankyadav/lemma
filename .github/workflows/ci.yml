name: CI
# FIX #255: isolated PostgreSQL acceptance gate follows in this PR.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # Each Playwright case runs exactly once; separate runners keep the growing
  # S/X × Graph day/night suite below the 30-minute per-job limit. All four
  # check runs must succeed, in addition to check, mcp-sql and qa3-screens.
  e2e:
    name: e2e-${{ matrix.shard }}-of-4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4 --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-shard-${{ matrix.shard }}
          path: test-results/screens/
          if-no-files-found: error
          retention-days: 14

  # Do not validate an incomplete shard: the 144 ST-0 PNG envelopes are
  # checked only after every shard succeeds and all artifacts are combined.
  qa3-screens:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: screens-shard-*
          path: test-results/screens/
          merge-multiple: true
      - name: Validate QA-3b screenshot PNG envelopes
        run: npx tsx scripts/qa3-screens.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa3-screenshot-structure
          path: test-results/qa3/screenshot-structure.md
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens/
          if-no-files-found: ignore
          retention-days: 14
  cpu-matrix:
    runs-on: ubuntu-latest
    # Each of the eight cells runs independently: no 60m shared-job tail,
    # no dropped routes, no reduced 4x CPU or 1500ms/1500-node budgets.
    strategy:
      fail-fast: false
      matrix:
        profile: [stress, extreme]
        theme: [graph, graph-night]
        width: [360, 390]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cold 4x first render of all 18 visual routes in this matrix cell
        run: >
          npx playwright test --config playwright.cpu.config.ts tests/cpu/stress-cpu.spec.ts
          --grep "AUDIT #540 cold 4x ${{ matrix.profile }} ${{ matrix.theme }} ${{ matrix.width }}px all 18 routes"
          --workers=1
      - name: Require all 18 cold screenshots in this matrix cell
        run: |
          count=$(find test-results/screens/stress-cpu -maxdepth 1 -type f -name '${{ matrix.profile }}-${{ matrix.theme }}-${{ matrix.width }}-*.png' | wc -l)
          test "$count" -eq 18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence-${{ matrix.profile }}-${{ matrix.theme }}-${{ matrix.width }}
          path: test-results/stress-cpu/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-screens-${{ matrix.profile }}-${{ matrix.theme }}-${{ matrix.width }}
          path: test-results/screens/stress-cpu/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-playwright-${{ matrix.profile }}-${{ matrix.theme }}-${{ matrix.width }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  cpu-aggregate:
    # Required independent gate: incomplete or failed cells cannot produce
    # a 144/144 PASS. Run even after a matrix failure to publish diagnostics.
    needs: [cpu-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: cpu-evidence-*
          merge-multiple: true
          path: test-results/stress-cpu/
      - name: Fail-closed 144-route cold 4x evidence report
        run: npx tsx scripts/qa3-cpu-report.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-144-route-report
          path: test-results/qa3/cpu-route-report.md
          if-no-files-found: ignore
          retention-days: 14
  mcp-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Isolated PostgreSQL is required to verify two real connections racing
    # against the NOTIF-1a advisory-lock cap; never use live Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: lemma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lemma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTIF_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/lemma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned isolated PostgreSQL harness
        run: npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.13 pg@8.16.3
      - name: Verify DB-2 action log, undo and owner isolation
        run: node tests/mcp/db2.mjs
      - name: Verify ST-5 owner-scoped aggregate and paging SQL
        run: node tests/mcp/st5.mjs
      - name: Verify DB-5 transcription provenance and reversible pages
        run: node tests/mcp/db5.mjs
      - name: Verify NOTIF-1a reminder tables, RLS and device cap
        run: node tests/mcp/notif1a.mjs
      - name: Verify NOTIF-1a two-connection insert and restore races
        run: node tests/mcp/notif1a-concurrency.mjs
      - name: Verify NOTIF-1b atomic notification actions, undo and owner isolation
        run: node tests/mcp/notif1b.mjs
      - name: Verify NOTIF-1b bounded candidates, due quota and time zones
        run: node tests/mcp/notif1b-candidates.mjs
      - name: Verify NOTIF-1b two-connection atomic claim and rollback
        run: node tests/mcp/notif1b-concurrency.mjs
      - name: Verify NOTIF-1b X 60-project/30k-card first-attempt candidate budget
        run: node tests/mcp/notif1b-stress.mjs
      - name: Verify MCP-2 atomic transactions when available
        if: hashFiles('tests/mcp/transactions.mjs') != ''
        run: node tests/mcp/transactions.mjs
