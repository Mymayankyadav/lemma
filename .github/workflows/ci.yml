name: CI
# FIX #255: isolated PostgreSQL acceptance gate follows in this PR.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    # ST-0's full 8-case extreme/stress acceptance can exceed 15 minutes.
    # Keep all tests and hard assertions; give the suite time to finish.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # Phase 0 adds the harness before screen specs land in P0-B.
      - run: npm run e2e -- --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens/
          if-no-files-found: ignore
          retention-days: 14
  mcp-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned isolated PostgreSQL harness
        run: npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.13
      - name: Verify DB-2 action log, undo and owner isolation
        run: node tests/mcp/db2.mjs
      - name: Verify DB-5 transcription provenance and reversible pages
        run: node tests/mcp/db5.mjs
      - name: Verify ST-5 owner-scoped aggregate and paging SQL
        run: node tests/mcp/st5.mjs
      - name: Verify MCP-2 atomic transactions when available
        if: hashFiles('tests/mcp/transactions.mjs') != ''
        run: node tests/mcp/transactions.mjs
