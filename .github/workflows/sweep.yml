name: sweep
# Labels and timers: escalate, S1 -> S0 after 2 h without a fix PR, lease-expired, needs-review, merge-conflict
# comments, run-plan metrics. GitHub runs the */30 schedule only every few hours, so the sweep also runs on
# events. Event runs are throttled (scripts/ci/sweep-throttle.mjs) and "light": they skip the heavy metrics
# pass unless agent-metrics is older than 30 minutes. Never checks out or runs PR code.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['PR gate']
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read
concurrency:
  group: sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: throttle
        id: throttle
        run: node scripts/ci/sweep-throttle.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # #1013: close PR-origin incidents (S1, or S1 escalated to S0) whose signature is no longer active, so an S0 freeze
      # cannot outlive its failure. Runs before the sweep so a resolved incident is not escalated again. Never touches
      # main incidents (those close only when main is green). Reads the registry issue; runs no PR code.
      - name: reconcile resolved PR incidents
        if: steps.throttle.outputs.skip != 'true'
        run: node scripts/ci/incident.mjs reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: sweep
        if: steps.throttle.outputs.skip != 'true'
        run: node scripts/ci/sweep.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SWEEP_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'light' }}
