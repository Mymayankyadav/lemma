name: Supabase
# FIX #253: deploy-time MCP verification follows in this PR.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
# A durable FIFO queue protects deployment and post-deploy selftests across
# workflow names, without dropping the second pending run on a third trigger.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.LEMMA_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase deploy skipped: add SUPABASE_ACCESS_TOKEN and a DB password secret."
          fi
      - name: Acquire durable MCP selftest FIFO ticket
        if: steps.credentials.outputs.ready == 'true'
        timeout-minutes: 56
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mcp-selftest-queue.mjs acquire
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: 2.122.0
      - name: Link Lemma
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref yemqnhnztlbyxmjxidis
      - name: Require verified Lemma MCP target
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          # Fail before deploying: an unverified endpoint must never look like a successful release.
          if [[ -f supabase/functions/mcp/index.ts ]]; then
            if [[ -z "$MCP_URL" ]]; then
              echo "::error::MCP_URL secret is required to verify the deployed connector. Keep the existing URL and secret unchanged."
              echo '### MCP post-deploy smoke: BLOCKED (MCP_URL not configured)' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [[ ! "$MCP_URL" =~ ^https://yemqnhnztlbyxmjxidis\.supabase\.co/functions/v1/mcp/[[:xdigit:]]{48}$ ]]; then
              echo "::error::MCP_URL must target the existing Lemma mcp function with a 48-hex-character path secret; no URL was printed."
              echo '### MCP post-deploy smoke: BLOCKED (invalid target)' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
      - name: Apply migrations
        if: steps.credentials.outputs.ready == 'true'
        run: |
          if [[ -d supabase/migrations ]]; then
            supabase db push
          else
            echo "::notice::No migrations yet; DB-1 supplies the new schema."
          fi
      - name: Deploy MCP
        id: deploy_mcp
        if: steps.credentials.outputs.ready == 'true'
        run: |
          if [[ -f supabase/functions/mcp/index.ts ]]; then
            supabase functions deploy mcp --no-verify-jwt
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::MCP-1 has not landed yet; no function to deploy."
          fi
      - name: Set up Node.js for MCP smoke
        if: steps.deploy_mcp.outputs.deployed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed MCP endpoint
        if: steps.deploy_mcp.outputs.deployed == 'true'
        shell: bash
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          # Smoke reads the configured endpoint; never echo or print MCP_URL.
          for attempt in 1 2 3; do
            echo "MCP smoke attempt $attempt/3 (300s maximum; no endpoint details)."
            if timeout --signal=TERM --kill-after=5s 300s node tests/mcp/smoke.mjs; then
              echo "Deployed MCP smoke passed (attempt $attempt)."
              echo '### MCP post-deploy smoke: PASS' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::MCP smoke attempt $attempt did not complete successfully within its bounded window."
            if [[ "$attempt" -eq 3 ]]; then
              echo '### MCP post-deploy smoke: FAIL (3 bounded attempts)' >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Deployed MCP smoke failed after 3 attempts. Inspect MCP and Supabase logs; do not disclose the connector URL."
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
      - name: Release MCP selftest FIFO ticket
        if: always() && steps.credentials.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mcp-selftest-queue.mjs release
