name: Review screenshots
on:
  push:
    branches: ['review/**']
permissions:
  contents: write
jobs:
  shots:
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: (npx vite preview --port 4173 --strictPort &) && sleep 5 && node scripts/review-shots.mjs
      - run: |
          git config user.name "review-bot"; git config user.email "review-bot@users.noreply.github.com"
          git add -f review-shots && git commit -m "[shots] screenshots" && git push
