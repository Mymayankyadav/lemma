name: Review screenshots
on:
  push:
    branches: ['review/**']
permissions:
  contents: write
jobs:
  shots:
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checks
        run: |
          mkdir -p ci-logs/screens
          (npm run typecheck > ci-logs/typecheck.txt 2>&1; echo "exit $?" >> ci-logs/typecheck.txt) || true
          (npm test > ci-logs/unit.txt 2>&1; echo "exit $?" >> ci-logs/unit.txt) || true
          (npm run build > ci-logs/build.txt 2>&1; echo "exit $?" >> ci-logs/build.txt) || true
          (npx playwright test --reporter=line > ci-logs/e2e.txt 2>&1; echo "exit $?" >> ci-logs/e2e.txt) || true
          cp test-results/screens/atlas-tree-*.png test-results/screens/plan-checkpoint-drawer.png ci-logs/screens/ 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name review-bot; git config user.email review-bot@users.noreply.github.com
          git add -f ci-logs && git commit -m "[shots] ui-7" && git push
