name: Review screenshots
on:
  push:
    branches: ['review/**']
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: mkdir -p ci-logs && (deno run -A --no-check --node-modules-dir=auto scripts/mcp-size.ts > ci-logs/size.txt 2>&1; echo "exit $?" >> ci-logs/size.txt) || true
      - run: |
          git config user.name review-bot; git config user.email review-bot@users.noreply.github.com
          git add -f ci-logs && git commit -m "[shots] size" && git push
