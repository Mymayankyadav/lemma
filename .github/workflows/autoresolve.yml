name: autoresolve
# v1.9: when an open PR's ONLY merge conflicts are in CURRENT.md / NEXT.md, merge main into it and keep both sides
# (scripts/ci/autoresolve.mjs). Runs on the default branch only and never runs PR code: it merges files with git.
# Triggers: main moved (PRs go stale), a PR changed (scope finished), hourly as a backstop, or by hand.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['scope']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (empty = every open PR)'
        required: false
        default: ''
      dry_run:
        description: '1 = report only, push nothing'
        required: false
        default: '0'
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
concurrency:
  group: autoresolve
  cancel-in-progress: false
jobs:
  autoresolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge main into PRs that conflict only in CURRENT.md / NEXT.md
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/ci/autoresolve.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          PR_NUMBER: ${{ inputs.pr || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) || '' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
