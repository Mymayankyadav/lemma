name: Deploy Lemma web
on:
  # Every main SHA is a potential web release candidate. A docs-only or
  # test-only final merge must still produce an exact-SHA deployed Pages build
  # and downstream live smoke; otherwise release tagging becomes manual.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lemma-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:syntax && npm run test:merge && npm run test:outbox
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp dist/index.html dist/manifest.webmanifest dist/service-worker.js site/
          cp -r dist/icons site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
