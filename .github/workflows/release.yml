name: Lemma live Pages smoke
on:
  workflow_run:
    workflows: ['Deploy Lemma web']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'test/release_*.js'
      - 'docs/lanes/F.md'
permissions:
  contents: read
concurrency:
  group: lemma-release-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-pages:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for actual Pages checks
        run: npx playwright install --with-deps chromium
      - name: Build isolated PWA shell for offline checks
        run: npm run build
      - name: Verify service worker offline and upgrade preservation
        run: node test/release_pwa.js
      - name: Assert intentionally broken URL fails closed
        run: node test/release_live_smoke.js --negative-self-test
      - name: Exercise ready Study against disposable real-build browser fixture
        run: node test/release_live_smoke.js --ready-self-test
      - name: Check published Pages anonymously
        env:
          LEMMA_LIVE_URL: https://mymayankyadav.github.io/lemma/
        run: node test/release_live_smoke.js
      - name: Upload Pages smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-release-live-screenshots
          path: test-output/release-live/*.png
          if-no-files-found: ignore
          retention-days: 14

  tagged-release:
    name: Publish verified web tag
    needs: [live-pages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag to equal current main HEAD
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "::error::Stale tag: tag commit differs from current main HEAD"
            exit 1
          }
      - name: Check latest exact-SHA CI and post-deploy live smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          node test/release_tag_guard.js --check "$RUNNER_TEMP/runs.json" "$GITHUB_SHA" "$(git rev-parse origin/main)"
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Verify all merged migration versions exist in Lemma production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.LEMMA_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing Supabase access token"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing Lemma DB password"; exit 1; }
          test ! -e supabase/.temp/project-ref || { echo "::error::Checkout unexpectedly pre-linked"; exit 1; }
          supabase link --project-ref yemqnhnztlbyxmjxidis --password "$SUPABASE_DB_PASSWORD"
          test "$(cat supabase/.temp/project-ref)" = yemqnhnztlbyxmjxidis
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" > "$RUNNER_TEMP/lemma-release-migrations.txt" 2>&1
          node test/release_migrations.js --check "$RUNNER_TEMP/lemma-release-migrations.txt"
      - name: Require full account-workspace restore acceptance on exact release SHA
        run: node test/release_recovery_gate.js --tag
      - name: Publish GitHub release, web only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Main can advance while long migration and browser checks execute.
          # Recheck immediately before publication; never tag an old deploy.
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "::error::Main advanced during release verification; abort"
            exit 1
          }
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Lemma web release. Android and physical-device verification remain paused.
          Study and tutor controls are available only where their own acceptance gates have passed.
          Legacy card backups do not yet include every account-scoped knowledge, study-plan and learning-event record.
          See docs/RELEASE.md for the release verification and recovery checklist.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Lemma $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
