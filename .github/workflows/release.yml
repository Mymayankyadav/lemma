name: Lemma live Pages smoke
on:
  workflow_run:
    workflows: ['Deploy Lemma web']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'test/release_*.js'
      - 'docs/lanes/F.md'
permissions:
  contents: read
concurrency:
  group: lemma-release-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-pages:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for actual Pages checks
        run: npx playwright install --with-deps chromium
      - name: Build isolated PWA shell for offline checks
        run: npm run build
      - name: Verify service worker offline and upgrade preservation
        run: node test/release_pwa.js
      - name: Assert intentionally broken URL fails closed
        run: node test/release_live_smoke.js --negative-self-test
      - name: Check published Pages anonymously
        env:
          LEMMA_LIVE_URL: https://mymayankyadav.github.io/lemma/
        run: node test/release_live_smoke.js
      - name: Upload Pages smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-release-live-screenshots
          path: test-output/release-live/*.png
          if-no-files-found: ignore
          retention-days: 14

  tagged-release:
    name: Publish verified web tag
    needs: [live-pages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only publish tags reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check exact-tag main web acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          for workflow in "Lemma regression tests" "Lemma local Supabase sync gates" "Deploy Lemma web"; do
            if ! jq -e --arg name "$workflow" '[.workflow_runs[] | select(.name == $name and .head_branch == "main" and .conclusion == "success")] | length > 0' "$RUNNER_TEMP/runs.json" >/dev/null; then
              echo "::error::Missing successful $workflow for exact tag commit $GITHUB_SHA on main"
              exit 1
            fi
          done
      - name: Publish GitHub release, web only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Lemma web release. Android and physical-device verification remain paused.
          Study and tutor controls are available only where their own acceptance gates have passed.
          Legacy card backups do not yet include every account-scoped knowledge, study-plan and learning-event record.
          See docs/RELEASE.md for the release verification and recovery checklist.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Lemma $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
