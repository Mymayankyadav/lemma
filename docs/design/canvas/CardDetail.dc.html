<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F7B538;text-decoration:none}
a:hover{color:#FFD47E}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:#8C8796}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #F7B538;outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.s{font-family:'STIX Two Text','Times New Roman',serif}
.num{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes ping{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#F4F0E6;background:#0D0C11">
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 30% at 100% 8%, rgba(247,181,56,0.09), rgba(247,181,56,0) 65%)"></div>

<header style="position:relative;display:flex;align-items:center;padding:58px 10px 0 12px">
<a href="Review.dc.html" aria-label="Back" style="width:44px;height:44px;display:grid;place-items:center;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
<span style="flex:1;display:flex;align-items:center;gap:6px;padding-left:4px;font-size:14px;color:#8C8796"><span class="s" style="font-style:italic;color:#F7B538;font-size:16px">∫</span>Compactness</span>
<button type="button" aria-label="Edit card" style="width:44px;height:44px;border:none;background:none;display:grid;place-items:center;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg></button>
<button type="button" aria-label="Pause card" style="width:44px;height:44px;border:none;background:none;display:grid;place-items:center;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
<button type="button" aria-label="Delete card" style="width:44px;height:44px;border:none;background:none;display:grid;place-items:center;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
</header>

<main style="position:relative;display:flex;flex-direction:column;gap:18px;padding:14px 24px 0">
<article style="border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(165deg, rgba(164,149,255,0.08), rgba(164,149,255,0) 42%), #1B1A22;border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.07), 0 30px 60px -30px rgba(0,0,0,0.95);animation:rise .5s cubic-bezier(.16,1,.3,1) both">
<p class="s" style="margin:0;font-size:22px;line-height:1.3">State the Heine–Borel theorem.</p>
<div aria-hidden="true" style="height:1px;background:rgba(255,255,255,0.08)"></div>
<p class="s" style="margin:0;font-size:18px;line-height:1.45;color:#C9C4D1">For <i>K</i> ⊆ ℝ<sup style="font-size:12px"><i>n</i></sup>: <i>K</i> is compact ⟺ <i>K</i> is closed and bounded.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<span style="height:28px;padding:0 9px;border-radius:9px;display:flex;align-items:center;gap:5px;font-size:12px;color:#ACA7B5;background:rgba(255,255,255,0.05)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><path d="M3 5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5H21z"/></svg>Rudin p. 40</span>
<a href="Session.dc.html" style="height:28px;padding:0 9px;border-radius:9px;display:flex;align-items:center;gap:5px;font-size:12px;color:#ACA7B5;background:rgba(255,255,255,0.05)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.3-4A8 8 0 1 1 20 11.5z"/></svg>S7</a>
<span style="height:28px;padding:0 9px;border-radius:9px;display:flex;align-items:center;gap:5px;font-size:12px;color:#ACA7B5;background:rgba(255,255,255,0.05)">Theorem</span>
</div>
</article>

<section aria-label="Memory" style="display:flex;flex-direction:column;gap:12px;animation:rise .5s .08s cubic-bezier(.16,1,.3,1) both">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8C8796">Next</span><span class="num" style="font-size:17px;font-weight:600">2 days</span></div>
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8C8796">Stability</span><span class="num" style="font-size:17px;font-weight:600">12 d</span></div>
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8C8796">Recall now</span><span class="num" style="font-size:17px;font-weight:600;color:#F7B538">94%</span></div>
</div>
<svg width="342" height="64" viewBox="0 0 342 64" role="img" aria-label="Six reviews: interval grew from 1 day to 12 days, one lapse on the third review" style="display:block">
<path d="M0 63.5H342" style="stroke:rgba(255,255,255,0.08);stroke-width:1"/>
<path d="M14 56 L70 50 L126 58 L182 46 L238 32 L320 10" style="fill:none;stroke:#F7B538;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:420;animation:draw 1.2s .2s cubic-bezier(.65,0,.35,1) both"/>
<circle cx="14" cy="56" r="4" style="fill:#F7B538"/>
<circle cx="70" cy="50" r="4" style="fill:#F7B538"/>
<circle cx="126" cy="58" r="4" style="fill:#F2545B"/>
<circle cx="182" cy="46" r="4" style="fill:#F39A4B"/>
<circle cx="238" cy="32" r="4" style="fill:#F7B538"/>
<circle cx="320" cy="10" r="5" style="fill:#4FC88E;filter:drop-shadow(0 0 6px rgba(79,200,142,0.7))"/>
</svg>
</section>

<section aria-label="Notes for your tutor" style="display:flex;flex-direction:column;gap:10px;animation:rise .5s .16s cubic-bezier(.16,1,.3,1) both">
<h2 style="margin:0;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;color:#F7B538"><path d="M12 3.5l1.6 4.9 4.9 1.6-4.9 1.6L12 16.5l-1.6-4.9L5.5 10l4.9-1.6z"/></svg>For your tutor</h2>
<sc-for list="{{comments}}" as="c" hint-placeholder-count="1">
<div style="border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#16151C;border:1px solid rgba(247,181,56,0.2);animation:rise .4s cubic-bezier(.16,1,.3,1) both">
<span style="font-size:15px;line-height:1.4">{{c.text}}</span>
<span style="display:flex;align-items:center;gap:7px;font-size:12px;color:#8C8796"><span style="width:7px;height:7px;border-radius:99px;background:#F7B538;animation:ping 2.4s ease-in-out infinite"></span>Next time you ask to update cards<span class="num" style="margin-left:auto">{{c.when}}</span></span>
</div>
</sc-for>
<div style="display:flex;align-items:center;gap:8px;padding:2px 2px;font-size:13px;color:#8C8796"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;color:#4FC88E;stroke-width:2.2"><path d="M5.5 12.5 10 17l8.5-9.5"/></svg>Shortened by Claude in S6</div>
</section>
</main>

<form aria-label="New note for your tutor" style="position:absolute;left:16px;right:16px;bottom:30px;height:56px;border-radius:20px;padding:0 6px 0 16px;box-sizing:border-box;display:flex;align-items:center;gap:8px;background:rgba(26,25,33,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.09);box-shadow:0 20px 40px -16px rgba(0,0,0,0.8)">
<label for="cd-note" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Note for your tutor</label>
<input id="cd-note" type="text" placeholder="Note for your tutor" value="{{draft}}" onChange="{{onDraft}}" style="flex:1;min-width:0;height:44px;border:none;background:none;font-size:15px;outline:none">
<button type="button" aria-label="Save note" onClick="{{send}}" style="width:44px;height:44px;border-radius:14px;border:none;display:grid;place-items:center;color:#1E1405;background:#F7B538"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:19px;height:19px;stroke-width:2.1"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', comments: [{ text: 'Too wordy. Make the hypotheses a cloze.', when: '2 h' }] };
  }
  renderVals() {
    const s = this.state;
    return {
      draft: s.draft,
      comments: s.comments,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        const t = (s.draft || '').trim();
        if (!t) return;
        this.setState({ draft: '', comments: s.comments.concat([{ text: t, when: 'now' }]) });
      }
    };
  }
}
</script>
</body>
</html>
