<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F7B538;text-decoration:none}
a:hover{color:#FFD47E}
button{font:inherit;color:inherit;cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.s{font-family:'STIX Two Text','Times New Roman',serif}
.num{font-variant-numeric:tabular-nums}
@keyframes driftA{from{transform:translate(0,0)}to{transform:translate(-14px,8px)}}
@keyframes driftB{from{transform:translate(0,0)}to{transform:translate(10px,-6px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.1);opacity:0}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.25);opacity:.9}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes settle{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>

<h1 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-0.02em">Atlas</h1>
</div>

</div>

<div style="position:absolute;right:14px;top:420px;display:flex;flex-direction:column;align-items:flex-end;gap:10px">
<div style="width:44px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:rgba(26,25,33,0.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08)">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'all' };
  }
  renderVals() {
    const f = this.state.f;
    const chip = (k) => ({
      on: f === k,
      color: f === k ? '#1E1405' : '#ACA7B5',
      bg: f === k ? '#F7B538' : 'rgba(26,25,33,0.72)',
      border: f === k ? '#F7B538' : 'rgba(255,255,255,0.08)'
    });
    const a = chip('all'), r = chip('rev'), d = chip('demo');
    return {
      fAll: a.on, allColor: a.color, allBg: a.bg, allBorder: a.border, showAll: () => this.setState({ f: 'all' }),
      fRev: r.on, revColor: r.color, revBg: r.bg, revBorder: r.border, showRev: () => this.setState({ f: 'rev' }),
      fDemo: d.on, demoColor: d.color, demoBg: d.bg, demoBorder: d.border, showDemo: () => this.setState({ f: 'demo' }),
      demoOp: f === 'rev' ? 0.18 : 1,
      revOp: f === 'demo' ? 0.18 : 1,
      restOp: f === 'all' ? 1 : 0.18,
      edgeOp: f === 'all' ? 1 : 0.35
    };
  }
}
</script>
