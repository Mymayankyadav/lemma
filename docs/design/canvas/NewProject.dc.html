<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F7B538;text-decoration:none}
a:hover{color:#FFD47E}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #F7B538;outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.s{font-family:'STIX Two Text','Times New Roman',serif}
.num{font-variant-numeric:tabular-nums}
@keyframes sheet{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes flip{0%{transform:translate(18px,-26px) rotate(14deg);opacity:0}35%{opacity:1}70%,100%{transform:none;opacity:1}}
@keyframes load{from{width:8%}to{width:37%}}
@keyframes sheen{0%{transform:translateX(-140%)}60%,100%{transform:translateX(420%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#F4F0E6;background:#0D0C11">
<div aria-hidden="true" style="position:absolute;inset:0;filter:blur(3px);opacity:.45">
<div style="position:absolute;left:24px;top:62px;width:160px;height:28px;border-radius:8px;background:#1C1B22"></div>
<div style="position:absolute;left:24px;right:24px;top:118px;height:190px;border-radius:28px;background:#17161D"></div>
</div>
<div aria-hidden="true" style="position:absolute;inset:0;background:rgba(5,5,8,0.55)"></div>

<section role="dialog" aria-label="New project" style="position:absolute;left:0;right:0;top:84px;bottom:0;border-radius:32px 32px 0 0;padding:10px 24px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg, rgba(164,149,255,0.06), rgba(164,149,255,0) 30%), #16151C;border-top:1px solid rgba(255,255,255,0.1);box-shadow:0 -30px 60px -20px rgba(0,0,0,0.8);animation:sheet .55s cubic-bezier(.16,1,.3,1) both">
<span aria-hidden="true" style="align-self:center;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,0.18)"></span>
<header style="display:flex;align-items:center;justify-content:space-between;margin-top:-2px">
<h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.015em">New project</h1>
<a href="Projects.dc.html" aria-label="Close" style="width:44px;height:44px;margin-right:-10px;display:grid;place-items:center;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</header>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="np-name" style="font-size:13px;color:#ACA7B5">Name</label>
<input id="np-name" type="text" value="Real Analysis" style="height:48px;border-radius:14px;padding:0 14px;box-sizing:border-box;font-size:16px;background:#0F0E14;border:1px solid rgba(255,255,255,0.09)">
</div>

<div role="radiogroup" aria-label="Subject" style="display:flex;gap:8px;flex-wrap:wrap">
<button type="button" role="radio" aria-checked="{{aOn}}" onClick="{{pickA}}" style="height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{aBorder}};background:{{aBg}}"><span class="s" style="font-style:italic;font-size:17px;color:#F7B538">∫</span>Analysis</button>
<button type="button" role="radio" aria-checked="{{tOn}}" onClick="{{pickT}}" style="height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{tBorder}};background:{{tBg}}"><span class="s" style="font-style:italic;font-size:17px;color:#ACA7B5">τ</span>Topology</button>
<button type="button" role="radio" aria-checked="{{lOn}}" onClick="{{pickL}}" style="height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{lBorder}};background:{{lBg}}"><span class="s" style="font-style:italic;font-size:17px;color:#ACA7B5">λ</span>Linear algebra</button>
<button type="button" aria-label="New subject" style="width:40px;height:40px;border-radius:13px;display:grid;place-items:center;border:1px dashed rgba(255,255,255,0.18);background:none;color:#ACA7B5"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label for="np-goal" style="font-size:13px;color:#ACA7B5">Goal</label>
<textarea id="np-goal" rows="3" style="resize:none;border-radius:14px;padding:12px 14px;box-sizing:border-box;font-size:15px;line-height:1.45;background:#0F0E14;border:1px solid rgba(255,255,255,0.09)">Prove the main theorems of Rudin ch. 2–4. Comfortable with ε–δ, shaky on topology arguments.</textarea>
</div>

<div aria-label="Reading Rudin, page 128 of 342" style="border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px;background:#0F0E14;border:1px solid rgba(247,181,56,0.22)">
<svg aria-hidden="true" width="46" height="54" viewBox="0 0 46 54" style="flex:none">
<rect x="6" y="10" width="30" height="40" rx="4" style="fill:#1E1D26;stroke:rgba(255,255,255,0.12);stroke-width:1"/>
<rect x="9" y="7" width="30" height="40" rx="4" style="fill:#23222C;stroke:rgba(255,255,255,0.14);stroke-width:1"/>
<g style="animation:flip 1.8s cubic-bezier(.16,1,.3,1) infinite"><rect x="12" y="4" width="30" height="40" rx="4" style="fill:#2B2934;stroke:rgba(247,181,56,0.75);stroke-width:1.2"/><path d="M18 14h18M18 20h14M18 26h16M18 32h10" style="stroke:rgba(247,181,56,0.6);stroke-width:1.6;stroke-linecap:round;fill:none"/></g>
</svg>
<span style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0">
<span style="display:flex;justify-content:space-between;font-size:14px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Rudin, Principles.pdf</span><span class="num" style="color:#ACA7B5">128/342</span></span>
<span style="position:relative;display:block;height:4px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,0.08)"><span style="position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:37%;background:linear-gradient(90deg,#D98E1C,#F7B538);animation:load 2.2s cubic-bezier(.16,1,.3,1) both"></span><span style="position:absolute;top:0;bottom:0;left:0;width:20px;background:linear-gradient(90deg,rgba(255,240,200,0),rgba(255,240,200,0.8),rgba(255,240,200,0));animation:sheen 2.4s ease-in-out infinite"></span></span>
<span style="display:flex;align-items:center;gap:5px;font-size:12px;color:#4FC88E"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px;stroke-width:2.4"><path d="M5.5 12.5 10 17l8.5-9.5"/></svg>Contents found, 11 chapters</span>
</span>
</div>

<div role="radiogroup" aria-label="Teaching style" style="display:flex;gap:8px;overflow-x:auto;margin-right:-24px;padding-right:24px">
<button type="button" role="radio" aria-checked="{{s0}}" onClick="{{pick0}}" style="flex:none;height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{b0}};background:{{g0}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4M12 17h.01"/></svg>Socratic</button>
<button type="button" role="radio" aria-checked="{{s1}}" onClick="{{pick1}}" style="flex:none;height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{b1}};background:{{g1}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Examples first</button>
<button type="button" role="radio" aria-checked="{{s2}}" onClick="{{pick2}}" style="flex:none;height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{b2}};background:{{g2}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg>Proof workshop</button>
<button type="button" role="radio" aria-checked="{{s3}}" onClick="{{pick3}}" style="flex:none;height:40px;padding:0 13px;border-radius:13px;display:flex;align-items:center;gap:7px;font-size:14px;border:1px solid {{b3}};background:{{g3}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg>Quick quiz</button>
</div>

<div style="display:flex;flex-direction:column;gap:12px;margin-top:2px">
<a href="Path.dc.html" style="height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#1E1405;background:linear-gradient(180deg,#FFCD66,#F2A92C);box-shadow:inset 0 1px 0 rgba(255,255,255,0.5), 0 14px 32px -12px rgba(247,181,56,0.75)">Create project</a>
<button type="button" style="align-self:center;height:40px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#ACA7B5;background:none;border:1px solid rgba(255,255,255,0.07)"><span>Then tell your tutor</span><span style="color:#F4F0E6;font-weight:600">Plan Real Analysis</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg></button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { subject: 'a', style: 0 };
  }
  renderVals() {
    const s = this.state;
    const onB = 'rgba(247,181,56,0.55)', offB = 'rgba(255,255,255,0.09)';
    const onG = 'rgba(247,181,56,0.12)', offG = 'rgba(255,255,255,0.03)';
    const sub = (k) => ({ on: s.subject === k, b: s.subject === k ? onB : offB, g: s.subject === k ? onG : offG });
    const sty = (i) => ({ on: s.style === i, b: s.style === i ? onB : offB, g: s.style === i ? onG : offG });
    const a = sub('a'), t = sub('t'), l = sub('l');
    const x0 = sty(0), x1 = sty(1), x2 = sty(2), x3 = sty(3);
    return {
      aOn: a.on, aBorder: a.b, aBg: a.g, pickA: () => this.setState({ subject: 'a' }),
      tOn: t.on, tBorder: t.b, tBg: t.g, pickT: () => this.setState({ subject: 't' }),
      lOn: l.on, lBorder: l.b, lBg: l.g, pickL: () => this.setState({ subject: 'l' }),
      s0: x0.on, b0: x0.b, g0: x0.g, pick0: () => this.setState({ style: 0 }),
      s1: x1.on, b1: x1.b, g1: x1.g, pick1: () => this.setState({ style: 1 }),
      s2: x2.on, b2: x2.b, g2: x2.g, pick2: () => this.setState({ style: 2 }),
      s3: x3.on, b3: x3.b, g3: x3.g, pick3: () => this.setState({ style: 3 })
    };
  }
}
</script>
</body>
</html>
