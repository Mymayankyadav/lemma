<title>Lemma Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one phone column (max 480px) over a full-bleed mathematical background; four tabs; every world swaps tokens, materials, type and background. */
:root{
  --bg:#0D0C11; --card:rgba(27,26,34,.72); --card-2:rgba(255,255,255,.04); --line:rgba(255,255,255,.08);
  --ink:#F4F0E6; --ink-2:#B3AEBB; --ink-3:#8C8796; --accent:#F7B538; --on-accent:#1E1405;
  --warn:#F39A4B; --bad:#F2545B; --good:#4FC88E; --track:rgba(255,255,255,.10); --tab-bg:rgba(22,21,28,.82);
  --card-border:1px solid rgba(255,255,255,.08); --card-shadow:0 18px 40px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
  --blur:blur(16px) saturate(140%); --radius:18px; --bg-css:none;
  --font-ui:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display:'Instrument Sans', system-ui, sans-serif; --font-num:'Instrument Sans', system-ui, sans-serif;
  --font-math:'STIX Two Text', 'Times New Roman', serif; --ds:1; --s:.92;
  color-scheme:dark;
}
html[data-density="cozy"]{--s:1}
html[data-density="comfortable"]{--s:1.1}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:calc(var(--s) * 14px);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg{position:fixed;inset:-3%;width:106%;height:106%;z-index:0;pointer-events:none}
#bgcss{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg-css)}
html.lively #bg{animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-1.6%,-1.2%) scale(1.03)}}
@media (prefers-reduced-motion:reduce){html.lively #bg{animation:none}.pulse{animation:none!important}}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(var(--s) * 12px) calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:calc(var(--s) * 14px)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-size:calc(var(--s) * 20px * var(--ds));font-weight:600;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:calc(var(--s) * 11.5px);color:var(--ink-3)}
.wswitch{display:flex;align-items:center;gap:2px;background:var(--card);border:var(--card-border);border-radius:999px;box-shadow:var(--card-shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:3px;min-width:0}
.wswitch button{height:34px;min-width:34px;display:grid;place-items:center;border-radius:999px;color:var(--ink-2)}
.wswitch .wname{padding:0 8px;font-size:calc(var(--s) * 12.5px);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
/* cards and materials */
.card{position:relative;background:var(--card);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:var(--radius);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:calc(var(--s) * 14px)}
.stack{display:flex;flex-direction:column;gap:calc(var(--s) * 12px)}
.sec{display:flex;flex-direction:column;gap:calc(var(--s) * 10px);margin-top:calc(var(--s) * 18px)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{margin:0;font-family:var(--font-display);font-size:calc(var(--s) * 15px * var(--ds));font-weight:600;letter-spacing:-.005em}
.sec-h small{color:var(--ink-3);font-size:calc(var(--s) * 11.5px)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.glyph{width:calc(var(--s) * 34px);height:calc(var(--s) * 34px);flex:none;display:grid;place-items:center;border-radius:calc(var(--radius) * .5);background:var(--card-2);border:1px solid var(--line);font-family:var(--font-math);font-style:italic;font-size:calc(var(--s) * 19px);color:var(--accent)}
.ttl{font-family:var(--font-display);font-weight:600;font-size:calc(var(--s) * 15.5px * var(--ds));line-height:1.2;letter-spacing:-.005em}
.sub{font-size:calc(var(--s) * 12px);color:var(--ink-2)}
.pct{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:calc(var(--s) * 20px);color:var(--accent);letter-spacing:-.02em}
.eta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:calc(var(--s) * 11.5px);color:var(--ink-2)}
.eta i{font-style:normal;color:var(--ink)}
.ok{color:var(--good)}.late{color:var(--warn)}
.tl{display:block;width:100%;overflow:visible;touch-action:manipulation}
.tl text{font-family:var(--font-ui)}
.chip{display:inline-flex;align-items:center;gap:6px;height:calc(var(--s) * 28px);padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);font-size:calc(var(--s) * 12px);color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:calc(var(--s) * 40px);padding:0 16px;border-radius:calc(var(--radius) * .6);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:calc(var(--s) * 13.5px)}
.btn.ghost{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn.small{height:calc(var(--s) * 32px);padding:0 12px;font-size:calc(var(--s) * 12.5px)}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.big{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:calc(var(--s) * 36px);line-height:1;letter-spacing:-.03em}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:calc(var(--s) * 11.5px);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:48px}
.fc div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink-3)}
.fc i{display:block;width:100%;max-width:18px;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--accent) 55%,transparent)}
.fc div:first-child i{background:var(--accent)}
.sig{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:calc(var(--s) * 10px) 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0;padding-top:0}
.sig .k{flex:none;font-family:var(--font-num);font-size:calc(var(--s) * 11px);font-weight:600;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2)}
.sig .k.gap{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.sig .k.str{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.sig .k.new{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.sig b{font-weight:600}
.sig p{margin:2px 0 0;font-size:calc(var(--s) * 12px);color:var(--ink-2)}
.resume{display:flex;align-items:center;gap:10px;padding:calc(var(--s) * 10px) calc(var(--s) * 12px)}
/* path */
.stage{padding:0}
.stage>button{width:100%;display:flex;align-items:center;gap:10px;padding:calc(var(--s) * 12px) calc(var(--s) * 14px);text-align:left}
.stage .cps{display:flex;flex-direction:column;padding:0 calc(var(--s) * 8px) calc(var(--s) * 8px)}
.cprow{display:flex;align-items:center;gap:10px;padding:calc(var(--s) * 8px) calc(var(--s) * 6px);border-radius:10px;text-align:left;width:100%}
.cprow:active{background:var(--card-2)}
.cprow .code{font-family:var(--font-num);font-size:calc(var(--s) * 11px);color:var(--ink-3);width:40px;flex:none}
.st{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--ink-3)}
.st.done{background:var(--accent);border-color:var(--accent)}
.st.revisit{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 25%,transparent)}
.st.now{border:3px solid var(--accent);background:var(--bg)}
.st.next{border-color:var(--ink-2)}
.st.locked{border-style:dotted;opacity:.7}
.st.proposed{border:1.5px dashed var(--accent)}
.chev{transition:transform .2s;color:var(--ink-3)}
.open>button .chev{transform:rotate(90deg)}
/* atlas */
.atlas-wrap{position:relative;height:calc(100dvh - 210px - env(safe-area-inset-bottom,0px));min-height:360px;border-radius:var(--radius);overflow:hidden;border:var(--card-border);background:color-mix(in srgb,var(--bg) 70%,transparent);touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#map text{font-family:var(--font-ui);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.crumbs{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.crumbs button{pointer-events:auto}
.zoomer{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoomer button,.crumbs button{background:var(--tab-bg);border:var(--card-border);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:10px;min-width:32px;height:32px;display:grid;place-items:center;font-size:calc(var(--s) * 12px);padding:0 8px;color:var(--ink)}
.mini{position:absolute;right:8px;bottom:8px;width:104px;height:104px;opacity:.94;border-radius:12px;background:var(--tab-bg);border:var(--card-border);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);touch-action:none;cursor:crosshair}
.outline{display:flex;flex-direction:column;gap:2px}
.onode{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:calc(var(--s) * 7px) 6px;border-radius:8px}
.onode .bar{width:56px;height:4px;flex:none}
.onode.l1{padding-left:22px}.onode.l2{padding-left:40px;font-size:calc(var(--s) * 13px)}
.onode .cnt{font-size:calc(var(--s) * 11px);color:var(--ink-3);font-family:var(--font-num)}
/* lab */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;display:flex;flex-direction:column;min-width:0}
.wcard.cur{outline:2px solid var(--accent);outline-offset:2px}
.wcard.out{opacity:.45}
.wcard canvas{display:block;width:100%;height:96px}
.wcard .bgc{position:absolute;inset:0 0 auto 0;height:96px;background:var(--bg-css);pointer-events:none}
.wcard .sample{position:absolute;left:10px;right:10px;top:40px;padding:8px 9px;font-size:11px}
.wcard .sample .card{padding:7px 8px;border-radius:calc(var(--radius) * .55)}
.wcard .sample b{font-family:var(--font-display);font-size:calc(12px * var(--ds));display:block;line-height:1.1}
.wcard .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:8px 8px 8px 10px;background:var(--bg);border-top:1px solid var(--line);font-size:12px}
.wcard .meta .nm{flex:1 1 100%;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-display);font-size:calc(12.5px * var(--ds))}
.keep{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);cursor:pointer}
.keep input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.star{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--ink-3)}
.star[aria-pressed="true"]{color:var(--accent)}
.opt{display:flex;align-items:center;gap:10px;padding:calc(var(--s) * 10px) 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt .pv{flex:1;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:calc(var(--radius) * .6);background:var(--card-2);border:1px solid var(--line)}
.seg button{height:calc(var(--s) * 34px);border-radius:calc(var(--radius) * .45);font-size:calc(var(--s) * 12.5px);color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--card-shadow);font-weight:600}
.choice{font-family:var(--font-num);font-size:12px;line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2);word-break:break-word;user-select:all}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs .tb{pointer-events:auto;max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:58px;border-radius:calc(var(--radius) + 4px);background:var(--tab-bg);border:var(--card-border);box-shadow:var(--card-shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45)}
.sheet{position:fixed;z-index:31;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);max-height:78dvh;overflow:auto;border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--tab-bg)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 2px;font-family:var(--font-display);font-size:calc(var(--s) * 19px * var(--ds));font-weight:600;line-height:1.2}
.sheet .crit{font-family:var(--font-math);font-size:calc(var(--s) * 15px);line-height:1.45;color:var(--ink);margin:10px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:calc(var(--s) * 12.5px);margin:10px 0}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;max-width:90vw}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.55}}
html:not(.lively) .pulse{animation:none}

/* ---------- world-specific materials ---------- */
[data-world="graph"] .btn{border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);border-radius:4px}
[data-world="graph"] .bar span{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 2px,transparent 2px 5px)}
[data-world="graph"] .sec-h h2{font-style:italic}
[data-world="chalk"] .btn{background:transparent;color:var(--accent);border:2px dashed var(--accent);font-family:'Caveat',cursive;font-size:calc(var(--s) * 19px)}
[data-world="chalk"] .btn.ghost{color:var(--ink);border-color:var(--line)}
[data-world="chalk"] .sec-h h2,[data-world="chalk"] .ttl,[data-world="chalk"] .brand b,[data-world="chalk"] .sheet h3{font-weight:700}
[data-world="chalk"] .bar{background:transparent;border:1px dashed var(--line)}
[data-world="blueprint"] .card::before{content:"";position:absolute;inset:-4px;pointer-events:none;background:
 linear-gradient(var(--ink),var(--ink)) left top/9px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) left top/1px 9px no-repeat,
 linear-gradient(var(--ink),var(--ink)) right top/9px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) right top/1px 9px no-repeat,
 linear-gradient(var(--ink),var(--ink)) left bottom/9px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) left bottom/1px 9px no-repeat,
 linear-gradient(var(--ink),var(--ink)) right bottom/9px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) right bottom/1px 9px no-repeat;opacity:.8}
[data-world="blueprint"] .btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:2px;font-family:var(--font-num);font-weight:500}
[data-world="blueprint"] .sec-h h2,[data-world="blueprint"] .chip{font-family:var(--font-num);font-weight:500}
[data-world="blueprint"] .bar{border-radius:0;height:5px}
[data-world="soft"] .btn{box-shadow:4px 4px 10px #BEC3CB,-4px -4px 10px #FFFFFF}
[data-world="soft"] .seg,[data-world="soft"] .chip,[data-world="soft"] .bar{box-shadow:inset 2px 2px 5px #C3C7CE,inset -2px -2px 5px #FFFFFF;border-color:transparent}
[data-world="soft"] .glyph{box-shadow:inset 2px 2px 5px #C3C7CE,inset -2px -2px 5px #FFFFFF;border-color:transparent}
[data-world="journal"] .card{background:transparent;border:0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding-inline:0}
[data-world="journal"] .tabs .tb,[data-world="journal"] .sheet{border:0;border-top:1.5px solid var(--ink);border-radius:0;box-shadow:none}
[data-world="journal"] .btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:0;font-variant:small-caps;letter-spacing:.04em;font-size:calc(var(--s) * 15px)}
[data-world="journal"] .sec-h h2{font-variant:small-caps;letter-spacing:.05em;font-weight:600;font-size:calc(var(--s) * 16px)}
[data-world="journal"] .sec{counter-increment:sec}
[data-world="journal"] .sec-h h2::before{content:counter(sec) ". ";color:var(--ink-3)}
[data-world="journal"] .glyph,[data-world="journal"] .chip{border-radius:0}
[data-world="journal"] .wswitch{border-radius:0;box-shadow:none}
[data-world="euclid"] .sec-h h2,[data-world="euclid"] .sheet h3{font-style:italic;font-weight:500}
[data-world="euclid"] .btn{border-radius:3px;letter-spacing:.02em}
[data-world="nebula"] .glyph,[data-world="polar"] .glyph{box-shadow:0 0 18px -6px var(--accent)}
[data-world="contour"] .card{border-left:0}
main{counter-reset:sec}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="bgcss" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand"><b>Lemma</b><span id="today"></span></div>
    <div class="wswitch" role="group" aria-label="World">
      <button data-act="wprev" aria-label="Previous world"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="wname" data-act="tolab" id="wname">World</button>
      <button data-act="wnext" aria-label="Next world"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <main id="view"></main>
</div>

function cps(p){
  const out = [];
  p.stages.forEach(([sn, list], si) => list.forEach(([code, title, st], i) => {
    out.push({ code, title, st, stage:sn, si, first:i===0, last:i===list.length-1 });
    p.proposed.filter(x => x.after === code).forEach(x => out.push({ code:x.code, title:x.title, st:'proposed', stage:sn, si, first:false, last:false, because:x.because }));
  }));
  return out;
}
function progress(p){
  const all = cps(p).filter(c => c.st !== 'proposed');
  const done = all.filter(c => c.st === 'done' || c.st === 'revisit').length;
  const remaining = all.length - done;
  const weeks = remaining / p.pace;
  const finish = new Date(TODAY.getTime() + weeks * 7 * 864e5);
  const target = p.target ? new Date(p.target + 'T12:00:00') : null;
  const spare = target ? Math.round((target - finish) / 864e5) : null;
  return { done, total: all.length, pct: Math.round(done / all.length * 100), finish, target, spare };
}

    if (!mini) { const cs = stages.map(s => (x(s.a) + x(s.b)) / 2); stages.forEach((s, si) => { const cx = cs[si], up = si % 2 === 0; const lft = si >= 2 ? cx - cs[si - 2] : cx * 2, rgt = si + 2 < cs.length ? cs[si + 2] - cx : (W - cx) * 2; const avail = Math.min(lft, rgt) - 8; const tx = clamp(cx, 4 + Math.min(avail, s.name.length * fs * .56) / 2, W - 4 - Math.min(avail, s.name.length * fs * .56) / 2); g += `<text x="${tx}" y="${up ? y - 13 : y + 22}" text-anchor="middle" font-size="${fs}" fill="var(--ink-2)">${esc(ell(s.name, avail))}</text>`; }); }
    g += goal(W - padR + 16, y);
  } else {
    const base = mini ? H - 4 : H - 30, top = mini ? 4 : 18;
    const d = L.map((c, i) => c.st === 'proposed' ? .6 : 1 + (hash(p.id + c.code) % 4) + i / n * 2.2);
    const cum = []; d.reduce((s, v, i) => (cum[i] = s + v, s + v), 0);
    const maxc = cum[n - 1]; const yy = i => base - (cum[i] / maxc) * (base - top);
    let path = `M${x(0)} ${yy(0)}`; for (let i = 1; i < n; i++) { const mx = (x(i - 1) + x(i)) / 2; path += ` C${mx} ${yy(i - 1)} ${mx} ${yy(i)} ${x(i)} ${yy(i)}`; }
    g += `<path d="${path} L${x(n - 1)} ${base} L${x(0)} ${base}Z" fill="var(--ink)" fill-opacity=".05"/>`;
    let dpath = `M${x(0)} ${yy(0)}`; for (let i = 1; i <= cur; i++) { const mx = (x(i - 1) + x(i)) / 2; dpath += ` C${mx} ${yy(i - 1)} ${mx} ${yy(i)} ${x(i)} ${yy(i)}`; }
    g += `<path d="${dpath} L${x(cur)} ${base} L${x(0)} ${base}Z" fill="var(--accent)" fill-opacity=".2"/>`;
    g += `<path d="${path}" fill="none" stroke="var(--ink-3)" stroke-width="1.3" stroke-dasharray="3 3"/><path d="${dpath}" fill="none" stroke="var(--accent)" stroke-width="${mini ? 2 : 2.4}"/>`;
    L.forEach((c, i) => { if (c.st === 'revisit') g += `<circle cx="${x(i)}" cy="${yy(i)}" r="2.6" fill="var(--bg)" stroke="var(--warn)" stroke-width="1.4"/>`; if (c.first && !mini) g += `<line x1="${x(i)}" y1="${yy(i) + 4}" x2="${x(i)}" y2="${base}" stroke="var(--ink-3)" stroke-opacity=".35" stroke-dasharray="1 3"/>`; });
    g += `<circle cx="${x(cur)}" cy="${yy(cur)}" r="${mini ? 7 : 11}" fill="var(--accent)" opacity=".2" class="pulse"/><circle cx="${x(cur)}" cy="${yy(cur)}" r="${mini ? 3.4 : 5}" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.6"/>`;
    g += curLabel(x(cur), yy(cur) - 14);
    if (!mini) stages.forEach((s, si) => { const nx = stages[si + 2]; const avail = (nx ? x(nx.a) : W - 4) - x(s.a) - 8; g += `<text x="${x(s.a)}" y="${base + 13 + (si % 2) * 12}" font-size="${fs}" fill="var(--ink-2)">${esc(ell(s.name, avail))}</text>`; });
    g += goal(x(n - 1) + 3, yy(n - 1) - 2);
  }
  return `<svg class="tl" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(p.title)} path: ${progress(p).done} of ${progress(p).total} checkpoints, now at ${L[cur].code} ${esc(L[cur].title)}">${g}${mini ? '' : hit()}</svg>`;
}

let MAP = null;
function layoutOrbits(){
  const nodes = [];

    const tops = s.tlist.map(t => { const m = t.ideas.length, rr = Math.max(16, m * 5.6), r = rr + 13; return { t, rr, r }; });
    const k = tops.length, maxR = Math.max(...tops.map(x => x.r)), rho = k === 1 ? 0 : (maxR + 8) / Math.sin(Math.PI / k);

  });

  subj.forEach((S0, i) => { const c = i % cols, r = Math.floor(i / cols); colW[c] = Math.max(colW[c], 2 * S0.r); rowH[r] = Math.max(rowH[r] || 0, 2 * S0.r + lab); });

  v.innerHTML = tab === 'home' ? viewHome() : tab === 'path' ? viewPath() : tab === 'atlas' ? viewAtlas() : viewLab();
  if (tab === 'atlas') mountAtlas(); else MAP = null;
  if (tab === 'lab') v.querySelectorAll('canvas[data-prev]').forEach(c => paintBG(c, WMAP[c.dataset.prev], c.clientWidth, c.clientHeight));
}
function setWorld(id){ S.world = id; save(); applyWorld(); render(); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (el.tagName === 'INPUT') return;
  if (a === 'wprev' || a === 'wnext') { const k = kept(); let i = k.findIndex(w => w.id === S.world); i = (i + (a === 'wnext' ? 1 : -1) + k.length) % k.length; if (i < 0) i = 0; setWorld(k[i].id); toast(k[i].name + ': ' + k[i].note); }
  else if (a === 'tolab') location.hash = 'lab';
  else if (a === 'world') setWorld(el.dataset.id);
  else if (a === 'fav') { S.fav[el.dataset.id] = !S.fav[el.dataset.id]; save(); render(); }
  else if (a === 'cp') cpSheet(el.dataset.p, el.dataset.code);
  else if (a === 'proj') { S.proj = el.dataset.id; save(); render(); }
  else if (a === 'stage') { const key = el.dataset.key; const open = el.getAttribute('aria-expanded') === 'true'; S.open[key] = !open; save(); render(); }
  else if (a === 'otog') { const key = el.dataset.key; const cur = el.textContent.trim().startsWith('▾'); S.open[key] = !cur; save(); render(); }
  else if (a === 'signal') { const s = SIGNALS[+el.dataset.i]; openSheet(`<h3 id="sheet-title">${esc(s.title)}</h3><div class="row" style="gap:6px"><span class="chip on">${s.code}</span><span class="chip">${esc(PMAP[s.p].title)}</span></div><p class="crit">${esc(s.text)}</p><div class="row" style="gap:8px">${s.code === 'D3' ? `<button class="btn" data-act="cp" data-p="algebra-1" data-code="CP11a">See CP11a</button>` : ''}<button class="btn ghost" data-act="close">Close</button></div>`); }
  else if (a === 'copy') copy(el.dataset.text, 'Copied: paste it in Claude');
  else if (a === 'toast') { toast(el.dataset.msg); closeSheet(); }
  else if (a === 'close') closeSheet();
  else if (a === 'atstyle') { S.at = el.dataset.k; save(); render(); }
  else if (a === 'filter') { S.filter = el.dataset.k; save(); if (MAP) { document.querySelectorAll('[data-act="filter"]').forEach(b => b.classList.toggle('on', b.dataset.k === S.filter)); drawMap(); } else render(); }
  else if (a === 'idea') { closeSheet(); selectIdea(el.dataset.id); }
  else if (a === 'zin') zoomBy(1.5); else if (a === 'zout') zoomBy(1 / 1.5);
  else if (a === 'zfit') { if (MAP) { MAP.focus = []; MAP.sel = null; const b = MAP.bounds; camTo({ x:(b.x0 + b.x1) / 2, y:(b.y0 + b.y1) / 2, k:MAP.fitK }); } }
  else if (a === 'crumb') { const i = +el.dataset.i; focusNode(i < 0 ? null : MAP.focus[i]); }
  else if (a === 'set') { S[el.dataset.key] = el.dataset.v; save(); applyWorld(); render(); }
  else if (a === 'reset') { S = { ...DEFAULT, keep:{}, fav:{}, open:{}, tlKeep:{ line:true, metro:true, ascent:true }, atKeep:{ orbits:true, branches:true, outline:true } }; WORLDS.forEach(w => S.keep[w.id] = true); save(); applyWorld(); render(); toast('Lab reset'); }
});
document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a === 'keep') { S.keep[el.dataset.id] = el.checked; save(); render(); }
  else if (a === 'tlkeep') { S.tlKeep[el.dataset.k] = el.checked; save(); render(); }
  else if (a === 'atkeep') { S.atKeep[el.dataset.k] = el.checked; save(); render(); }
  else if (a === 'usetl') { S.tl = el.dataset.k; save(); render(); }
  else if (a === 'useat') { S.at = el.dataset.k; save(); render(); }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawPageBG(); render(); }, 150); });
$('#today').textContent = TODAY.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
applyWorld(); render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawPageBG(); if (tabFromHash() === 'lab') render(); });
</script>
