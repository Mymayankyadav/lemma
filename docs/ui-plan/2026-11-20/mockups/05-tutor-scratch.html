<!doctype html><html lang="en" data-v7 data-theme="graph-night"><head><meta charset="utf-8"><title>Tutor · scratch pad</title>
<link rel="stylesheet" href="/lemma/fonts/v7/fonts.css"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="mock.css"><script src="icons.js"></script>
<style>
.th{height:56px;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;border-bottom:1px solid var(--v7-role-border-subtle)}
.presence{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--v7-role-status-success-subtle);color:var(--v7-role-status-success);font:600 12px/1 var(--v7-sans)}
.presence i{width:7px;height:7px;border-radius:50%;background:var(--v7-role-status-success)}
.timer{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--v7-role-surface-muted);font:600 13px/1 var(--v7-mono)}
.q{padding:12px 16px 8px}
.composer{padding:6px 12px 0}
.att{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.thumb{width:56px;height:40px;border-radius:8px;background:#fff;overflow:hidden;position:relative;border:1px solid var(--v7-role-border-subtle)}
.attchip{display:flex;align-items:center;gap:8px;height:48px;padding:4px 6px 4px 4px;border-radius:12px;background:var(--v7-role-surface-raised);border:1px solid var(--v7-role-border-subtle)}
.field{display:flex;align-items:center;gap:8px;height:52px;border-radius:26px;padding:0 6px 0 16px;background:var(--v7-role-surface-raised);border:1px solid var(--v7-role-border-default)}
.send{width:40px;height:40px;border-radius:20px;background:var(--v7-role-action-bg);color:var(--v7-role-text-on-action);display:flex;align-items:center;justify-content:center}
.tools{display:grid;grid-template-columns:repeat(6,1fr);margin-top:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;height:50px;justify-content:center;color:var(--v7-role-text-secondary);font:500 11.5px/1 var(--v7-sans);border-radius:12px}
.tool.on{background:var(--v7-role-selection-subtle);color:var(--v7-role-link-fg)}
.padbox{position:absolute;left:0;right:0;bottom:0;height:372px;background:var(--v7-role-surface-sunken);border-top:1px solid var(--v7-role-border-subtle)}
.padbar{display:flex;align-items:center;gap:2px;padding:6px 8px}
.pb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--v7-role-text-secondary)}
.pb.on{background:var(--v7-role-surface-muted);color:var(--v7-role-text-primary)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--v7-role-text-primary)}
.canvas{position:absolute;left:10px;right:10px;top:54px;bottom:12px;border-radius:16px;border:1px solid var(--v7-role-border-subtle);
 background:radial-gradient(circle,var(--v7-role-border-subtle) 1.2px,transparent 1.3px) 0 0/18px 18px,var(--v7-role-surface-page)}
</style></head><body>
<div class="phone">
 <header class="th">
  <span class="ib"><span class="i" data-i="chevron-left"></span></span>
  <div class="grow"><div style="font:600 16px/1.2 var(--v7-sans)">Compactness</div><div class="t-cap">CP4 · step 3 of 4</div></div>
  <span class="presence"><i></i>Listening</span><span class="timer">14:31</span><span class="ib" style="width:36px"><span class="i" data-i="ellipsis"></span></span>
 </header>
 <div class="q"><div class="t-eyebrow" style="margin-bottom:4px">Tutor</div>
  <div class="t-reading">Compactness keeps finitely many <span class="m">V<sub>y<sub>i</sub></sub></span>. <b>What open set around <span class="m">x</span> misses <span class="m">K</span>?</b></div></div>
 <div class="composer">
  <div class="att">
   <div class="attchip"><div class="thumb"><svg width="56" height="40" viewBox="0 0 280 200" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"><path d="M40 110 C 40 50, 150 40, 170 80 C 190 120, 140 160, 90 150 C 60 145, 40 130, 40 110z"/><circle cx="235" cy="95" r="34"/></svg></div>
    <div><div style="font:600 13px/1.2 var(--v7-sans)">Drawing</div><div class="t-cap">Sends with your answer</div></div><span class="ib" style="width:32px;height:32px"><span class="i s" data-i="x"></span></span></div>
   <div class="attchip" style="width:48px;justify-content:center;border-style:dashed"><span class="i s ter" data-i="camera"></span></div>
  </div>
  <div class="field"><span class="t-body grow">Intersect the <span class="m">U<sub>y<sub>i</sub></sub></span> — finite, so open</span><span class="send"><span class="i s" data-i="arrow-up"></span></span></div>
  <div class="tools">
   <span class="tool on"><span class="i" data-i="pen-line"></span>Scratch</span><span class="tool"><span class="i" data-i="camera"></span>Photo</span>
   <span class="tool"><span class="i" data-i="lightbulb"></span>Hint 1/4</span><span class="tool"><span class="i" data-i="life-buoy"></span>Stuck</span>
   <span class="tool"><span class="i" data-i="sigma"></span>Symbols</span><span class="tool"><span class="i" data-i="keyboard"></span>Keys</span>
  </div>
 </div>
 <section class="padbox" aria-label="Scratch pad">
  <div class="padbar">
   <span class="pb on"><span class="i s" data-i="pen-line"></span></span>
   <span class="pb" style="gap:6px;width:auto;padding:0 8px"><span class="dot" style="width:6px;height:6px"></span><span class="dot"></span><span class="dot" style="width:14px;height:14px;background:var(--v7-role-link-fg)"></span></span>
   <span class="pb"><span class="i s" data-i="eraser"></span></span><span class="pb"><span class="i s" data-i="hand"></span></span><span class="pb"><span class="i s" data-i="undo-2"></span></span>
   <span class="grow"></span><span class="pb"><span class="i s" data-i="maximize-2"></span></span><span class="pb"><span class="i s" data-i="chevron-down"></span></span>
  </div>
  <div class="canvas"><svg width="100%" height="100%" viewBox="0 0 370 306" fill="none" stroke="var(--v7-role-text-primary)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
   <path d="M44 150 C 44 80, 170 66, 196 112 C 222 158, 160 208, 104 198 C 70 192, 44 176, 44 150z"/>
   <g stroke-dasharray="5 5" stroke="var(--v7-role-link-fg)"><circle cx="82" cy="140" r="30"/><circle cx="136" cy="112" r="28"/><circle cx="156" cy="170" r="27"/></g>
   <circle cx="82" cy="140" r="2" fill="var(--v7-role-text-primary)"/><circle cx="136" cy="112" r="2" fill="var(--v7-role-text-primary)"/><circle cx="156" cy="170" r="2" fill="var(--v7-role-text-primary)"/>
   <circle cx="300" cy="132" r="2.5" fill="var(--v7-role-text-primary)"/><circle cx="300" cy="132" r="42"/><circle cx="300" cy="132" r="30" stroke-dasharray="3 4"/>
   <path d="M292 196 l6 -16 l6 16 M295 190 h8" stroke-width="2"/>
   <path d="M60 236 c 6 -10, 14 -10, 18 0" stroke-width="2"/>
   <path d="M118 238 l 12 0 M 124 232 l 0 12" stroke-width="2"/><path d="M146 244 c 2 -12, 12 -12, 14 0 m 6 -10 c 0 8, 4 12, 10 10" stroke-width="2"/>
   <path d="M196 238 l 22 0 M210 230 l 8 8 l -8 8" stroke-width="2"/><path d="M232 244 c 4 -14, 16 -14, 18 -2 c 2 10, -10 12, -14 6" stroke-width="2"/>
  </svg>
  <span class="t-cap" style="position:absolute;right:12px;bottom:8px">Two fingers to scroll</span></div>
 </section>
</div></body></html>
