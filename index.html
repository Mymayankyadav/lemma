<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="__PAPER_DAY__" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="__PAPER_NIGHT__" />
    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
<script>
      /* Graph paper before first paint, with migration from obsolete worlds. G0 (v7 UX audit r3): the papers come
         from the build's v7 flag (src/app/paper.ts, filled in by vite.config.ts). */
      (function(){
        var colors={graph:'__PAPER_DAY__','graph-night':'__PAPER_NIGHT__'},mode='auto';
        try{var saved=JSON.parse(localStorage.getItem('lemma.ui')||'null');
          if(saved&&typeof saved==='object'){
            if(['auto','day','night'].includes(saved.mode))mode=saved.mode;
            else if(saved.theme==='graph')mode='day';
            else if(saved.theme==='graph-night')mode='night';
          }}catch(_){}
        var query=new URLSearchParams(location.search);
        if(['auto','day','night'].includes(query.get('mode')))mode=query.get('mode');
        if(query.get('theme')==='graph')mode='day';
        else if(query.get('theme')==='graph-night')mode='night';
        else if(query.get('theme')==='system')mode='auto';
        var actual=mode==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'graph-night':'graph'):mode==='day'?'graph':'graph-night';
        document.documentElement.dataset.theme=actual;
        document.documentElement.dataset.appearanceMode=mode;
        document.documentElement.dataset.density='compact';
        document.documentElement.dataset.effects='calm';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function(meta){meta.setAttribute('content',colors[actual]);});
        /* incident #1376: the splash (below) paints this same build paper, so index.html carries no fixed paper hex. */
        document.documentElement.style.setProperty('--lemma-paper',colors[actual]);
        try{localStorage.setItem('lemma.ui',JSON.stringify({mode:mode}))}catch(_){}
      })();
    </script>
    <!-- Route-only early module request: avoid waiting for App's static graph on
         direct Review-run deep links; never preload this chunk on other routes. -->
    <script type="module" data-review-run-preload>
      if (location.hash.split('?')[0] === '#/review/run') {
        void import('/src/features/review-run/Page.tsx')
      }
    </script>
    <script type="module">
      import {isV7Route} from '/src/app/v7Kit.ts';
      import {loadShellFonts} from '/src/app/shellFonts.ts';
      // Every v7 route (not only /kit) uses the self-hosted v7 fonts from the first paint; v7 never requests Google Fonts.
      const v7=isV7Route();
      if(v7)document.documentElement.setAttribute('data-v7','');
      loadShellFonts(v7);
    </script>
    <!-- N131 · A5′ the site's share preview (drawn by src/ui/v7/shareImage.ts; regenerate with scripts/brand/og-image.mjs). -->
    <meta name="description" content="Persistent, proof-first mathematical study with an AI tutor." />
